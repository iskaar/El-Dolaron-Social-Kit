<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Dolarón — tarjeta de botes</title>
<style>
  :root { --azul:#16366B; --rojo:#D72B32; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f9; color: #1a1f2b;
    font-family: system-ui, -apple-system, sans-serif; }
  header { background: var(--azul); color: #fff; padding: 14px 20px; display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header a, header button { color: #FFD447; background: none; border: 0; font-size: 14px; cursor: pointer; }
  main { padding: 20px; max-width: 800px; margin: 0 auto; }
  .ayuda { font-size: 13px; color: #5b6478; line-height: 1.5; max-width: 66ch; }
  .tarjeta { background: #fff; border: 1px solid #dfe3ea; border-radius: 12px; padding: 10mm 8mm;
    margin-top: 16px; }
  .titulo { text-align: center; font-size: 20px; font-weight: 800; color: var(--azul); }
  .subtitulo { text-align: center; font-size: 12px; color: #5b6478; margin-bottom: 8mm; }
  .bote { display: flex; align-items: center; justify-content: space-between; gap: 8mm;
    padding: 6mm 0; border-top: 1px solid #e6e9ef; }
  .precio { font-size: 34px; font-weight: 800; color: var(--azul); width: 30mm; }
  .codigo { font-family: ui-monospace, monospace; font-size: 11px; text-align: center; margin-top: 1mm; }
  @media print {
    header, .ayuda { display: none !important; }
    body { background: #fff; }
    main { padding: 0; max-width: none; }
    .tarjeta { border: 0; margin: 0; }
    @page { size: letter; margin: 12mm; }
  }
</style>
</head>
<body>
<header>
  <h1>Tarjeta de botes</h1>
  <button type="button" onclick="print()">Imprimir</button>
  <a href="/caja">← Caja</a>
</header>

<main>
  <p class="ayuda">
    Imprime esta hoja, recórtala y lamínala. Va pegada junto a la caja: la cajera
    escanea el código del bote una vez por pieza, en lugar de teclear el precio.
    Los botes no descuentan existencias.
  </p>

  <div class="tarjeta">
    <div class="titulo">EL DOLARÓN</div>
    <div class="subtitulo">Botes de precio fijo</div>
    <div id="botes"></div>
  </div>
</main>

<script type="module">
import { svgCode128 } from '/code128.js';

const botes = [['BIN-20', 20], ['BIN-40', 40], ['BIN-60', 60]];
document.getElementById('botes').innerHTML = botes.map(([codigo, precio]) => `
  <div class="bote">
    <div class="precio">$${precio}</div>
    <div>
      ${svgCode128(codigo, { modulo: 0.5, alto: 14 })}
      <div class="codigo">${codigo}</div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
