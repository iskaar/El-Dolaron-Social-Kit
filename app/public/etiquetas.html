<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Dolarón — etiquetas</title>
<style>
  :root { --azul:#16366B; --linea:#dfe3ea; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f9; color: #1a1f2b;
    font-family: system-ui, -apple-system, sans-serif; }
  header { background: var(--azul); color: #fff; padding: 14px 20px;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header a { color: #FFD447; font-size: 14px; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  .barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button { border: 0; border-radius: 8px; padding: 10px 14px; font-size: 14px;
    font-weight: 600; cursor: pointer; background: var(--azul); color: #fff; }
  button.claro { background: #fff; color: #1a1f2b; border: 1px solid var(--linea); }
  .lista { background: #fff; border: 1px solid var(--linea); border-radius: 12px; overflow: hidden; }
  .renglon { display: grid; grid-template-columns: 28px 34px 56px 1fr 110px 90px;
    gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--linea); }
  .renglon .posicion { color: #9aa4b6; font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  .renglon:first-child { border-top: 0; }
  .renglon img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; background: #eceff4; }
  .renglon .precio { font-weight: 700; }
  .renglon.bin { grid-template-columns: 28px 60px 1fr 90px 140px; }
  .renglon.bin input.cantidad { width: 48px; padding: 5px 6px; border: 1px solid var(--linea);
    border-radius: 6px; font-size: 14px; }
  .vacio { padding: 24px; text-align: center; color: #5b6478; }
  .ayuda { font-size: 13px; color: #5b6478; line-height: 1.45; margin: 0 0 16px; max-width: 70ch; }

  /* Impresora de 2 x 1 in (50.8 x 25.4 mm), 2 in a lo ancho del cabezal.
     Reemplaza la Zebra TLP 2844 (57 x 32 mm) del 2026-09-20. El ancho de
     modulo del codigo de barras sigue pendiente de calibrar en esta
     impresora con /prueba-codigo.
     Margen de sobra a proposito: un nombre de dos renglones que empuje el
     contenido mas alla de los 25.4mm de la etiqueta fuerza una segunda
     pagina de impresion vacia para el sobrante -- ese "salto" consume una
     etiqueta fisica en blanco y desalinea todas las que siguen contra el
     orden de captura. Mejor una etiqueta con aire de sobra que una en blanco. */
  #hoja { display: none; }
  .etiqueta { width: 50.8mm; height: 25.4mm; padding: 1mm; border: 0.2mm dashed #bbb;
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .etiqueta .arriba { display: flex; justify-content: space-between; gap: 1mm; align-items: flex-start; }
  .etiqueta .marca { flex: 0 0 auto; line-height: 0; }
  /* El nombre es lo que se lee de cerca, asi que se lleva el espacio sobrante.
     Dos renglones es lo que cabe sin empujar el codigo de barras, y los
     nombres largos se cortan con puntos suspensivos. */
  .etiqueta .nombre { font-size: 2.3mm; line-height: 1.1; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .etiqueta .precios { display: flex; align-items: baseline; gap: 1.2mm; }
  .etiqueta .ahora { font-size: 4.4mm; font-weight: 800; letter-spacing: -0.15mm; }
  .etiqueta .antes { font-size: 2.2mm; text-decoration: line-through; color: #555; }
  /* El codigo de barras ocupa su propio renglon: recortado no lo lee el lector. */
  .etiqueta .pie { text-align: center; }
  .etiqueta .codigo { font-size: 1.8mm; font-family: ui-monospace, monospace; letter-spacing: 0.1mm; }
  .etiqueta svg { display: block; margin: 0 auto; }

  @media print {
    header, .barra, .lista, .vacio, .ayuda { display: none !important; }
    body { background: #fff; }
    main { padding: 0; max-width: none; }
    #hoja { display: block !important; }
    /* Sin borde en papel termico, y una etiqueta por pagina. */
    .etiqueta { border: 0; break-inside: avoid; }
    .etiqueta:not(:last-child) { break-after: page; }
    @page { size: 50.8mm 25.4mm; margin: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Etiquetas</h1>
  <a href="/admin">← Cola de revisión</a>
  <a href="/captura">Capturar →</a>
</header>

<main>
  <div class="barra">
    <button id="imprimir" type="button">Imprimir seleccionadas</button>
    <button id="todas" class="claro" type="button">Seleccionar todas</button>
    <button id="ninguna" class="claro" type="button">Deseleccionar todas</button>
    <span id="resumen"></span>
  </div>

  <p class="ayuda">
    Etiqueta de 2 × 1 in (50.8 × 25.4 mm). En el diálogo de impresión: la impresora de
    etiquetas, escala <b>100 %</b> y <b>sin</b> «Ajustar a la página» ni márgenes.
    Escalar la hoja deforma las barras y el lector deja de leerlas.
  </p>

  <div class="lista" id="lista"><div class="vacio">Cargando…</div></div>
  <div id="hoja"></div>
</main>

<script type="module">
import { svgCode128 } from '/code128.js';
import { svgLogoD } from '/logo.js';

const lista = document.getElementById('lista');
const hoja = document.getElementById('hoja');
const resumen = document.getElementById('resumen');
const pesos = (centavos) => `$${Math.round(centavos / 100)}`;
const escapar = (texto) => texto.replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// Los bines no tienen id de borrador (no pasan por captura): se guardan aparte
// para que el boton de imprimir sepa cuantas etiquetas de cada uno generar.
let binesActuales = [];

async function cargar() {
  const piezas = (await (await fetch('/api/borradores?estado=listo')).json())
    .filter((p) => p.destino === 'etiqueta' && p.precio > 0);
  binesActuales = (await (await fetch('/api/catalogo')).json())
    .filter((p) => p.sin_inventario === 1);
  const bins = binesActuales;

  resumen.textContent = `${piezas.length} piezas listas para etiquetar`;
  if (piezas.length === 0 && bins.length === 0) {
    lista.innerHTML = '<div class="vacio">Nada para etiquetar.</div>';
    return;
  }

  // El numero es la posicion en el orden de captura: las piezas se quedan
  // fisicamente donde se tomaron hasta que se les pega la etiqueta, asi que
  // contar "1, 2, 3..." contra la fila de piezas evita tener que adivinar
  // cual etiqueta impresa es de cual pieza.
  const filasPiezas = piezas.map((p, i) => `
    <label class="renglon">
      <span class="posicion">${i + 1}</span>
      <input type="checkbox" value="${p.id}" checked>
      <img src="/api/foto/${p.id}" alt="" loading="lazy">
      <span>${escapar(p.nombre || 'Sin nombre')}</span>
      <span class="precio">${pesos(p.precio)}${p.precio_lista > p.precio ? ` <s style="font-weight:400;color:#777">${pesos(p.precio_lista)}</s>` : ''}</span>
      <span>${p.stock > 1 ? `${p.stock} piezas` : p.semana_ingreso}</span>
    </label>`).join('');

  const filasBins = bins.map((p) => `
    <label class="renglon bin">
      <span class="posicion">·</span>
      <input type="number" class="cantidad" min="0" max="99" value="0" data-codigo="${p.codigo}">
      <span>${escapar(p.nombre || p.codigo)}</span>
      <span class="precio">${pesos(p.precio)}</span>
      <span>etiquetas a imprimir</span>
    </label>`).join('');

  lista.innerHTML = filasPiezas + filasBins;
}

function etiqueta(p) {
  const esBin = p.sin_inventario === 1;
  const antes = !esBin && p.precio_lista > p.precio ? `<span class="antes">${pesos(p.precio_lista)}</span>` : '';

  // El codigo completo (ED-000123, 9 caracteres) no cabe legible en una etiqueta
  // chica: la barra codifica solo el numero, sin "ED-" ni ceros (p.ej. "123").
  // El texto impreso sigue mostrando el codigo completo; buscarPieza() en
  // caja.html reconstruye "ED-000123" a partir del numero que entrega el lector.
  //
  // Los bines ("B20") y los codigos manuales (un barcode ya existente, como el
  // de una pieza que llego con su propio codigo de fabrica) se imprimen tal
  // cual: buscarPieza() los encuentra por coincidencia exacta, y al no empezar
  // con "ED-" nunca se confunden con un numero reconstruido.
  const contenido = p.codigo.startsWith('ED-') ? String(Number(p.codigo.slice(3))) : p.codigo;

  // ponytail: 0.5mm es lo maximo que sono siempre en la Zebra TLP 2844 (203 dpi)
  // y sigue sin confirmarse en la impresora de 2026-09-20 (correr /prueba-codigo
  // y ajustar si no lee). Un codigo largo (un barcode manual, no el numero
  // corto de siempre) se angosta lo necesario para caber en los ~47mm utiles
  // de la etiqueta -- formula de code128.js: 11 modulos por caracter mas 55 de
  // encabezado/paro/zona muda.
  const modulo = Math.min(0.5, 47 / (11 * contenido.length + 55));
  const barra = svgCode128(contenido, { modulo, alto: 4.8 });
  const pie = esBin ? p.codigo : `${p.codigo} · ${p.semana_ingreso}`;

  return `<div class="etiqueta">
    <div class="arriba">
      <div class="nombre">${escapar(p.nombre || 'El Dolarón')}</div>
      <div class="marca">${svgLogoD({ alto: 6 })}</div>
    </div>
    <div class="precios"><span class="ahora">${pesos(p.precio)}</span>${antes}</div>
    <div class="pie">
      ${barra}<div class="codigo">${pie}</div>
    </div>
  </div>`;
}

document.getElementById('todas').addEventListener('click', () => {
  lista.querySelectorAll('input[type=checkbox]').forEach((c) => { c.checked = true; });
});
document.getElementById('ninguna').addEventListener('click', () => {
  lista.querySelectorAll('input[type=checkbox]').forEach((c) => { c.checked = false; });
});

document.getElementById('imprimir').addEventListener('click', async () => {
  const ids = [...lista.querySelectorAll('input[type=checkbox]:checked')].map((c) => c.value);
  const cantidadesBin = [...lista.querySelectorAll('input.cantidad')]
    .map((c) => ({ codigo: c.dataset.codigo, cantidad: Math.min(99, Math.max(0, Number(c.value) || 0)) }))
    .filter((b) => b.cantidad > 0);

  if (ids.length === 0 && cantidadesBin.length === 0) return;

  let piezasHoja = [];
  if (ids.length > 0) {
    // El codigo se asigna aqui: una pieza sin etiqueta impresa no necesita codigo.
    const respuesta = await fetch('/api/etiquetas', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids }),
    });
    const piezas = await respuesta.json();
    if (!respuesta.ok) {
      resumen.textContent = piezas.error;
      return;
    }
    // Una etiqueta por pieza: cinco tazas iguales necesitan cinco etiquetas.
    piezasHoja = piezas.flatMap((p) => Array.from({ length: Math.min(99, Math.max(1, p.stock ?? 1)) }, () => etiqueta(p)));
  }

  // Los bines no tienen stock: la cantidad la escribe quien va a pegar las
  // etiquetas en las piezas que va a meter al bote.
  const binesHoja = cantidadesBin.flatMap(({ codigo, cantidad }) => {
    const bin = binesActuales.find((b) => b.codigo === codigo);
    return bin ? Array.from({ length: cantidad }, () => etiqueta(bin)) : [];
  });

  hoja.innerHTML = piezasHoja.concat(binesHoja).join('');
  print();
  await cargar();
});

await cargar();
</script>
</body>
</html>
