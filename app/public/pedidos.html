<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Dolarón — pedidos</title>
<style>
  :root { --azul:#16366B; --rojo:#D72B32; --verde:#1f7a4d; --amarillo:#FFD447; --linea:#dfe3ea; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f9; color: #1a1f2b; font-family: system-ui, -apple-system, sans-serif; }
  header { background: var(--azul); color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header a { color: var(--amarillo); font-size: 13px; }
  .caja-nombre { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #fff; margin: 0; }
  .caja-nombre select { width: auto; padding: 4px 8px; font-size: 14px; border-radius: 8px; border: 0; }
  main { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 14px; }
  h2 { margin: 0 0 8px; font-size: 18px; color: var(--azul); }
  h3 { margin: 18px 0 6px; font-size: 15px; color: var(--azul); }
  label, legend { display: block; font-size: 13px; color: #5b6478; margin: 12px 0 4px; padding: 0; }
  input, select { width: 100%; padding: 12px; font-size: 17px; border: 1px solid var(--linea); border-radius: 10px; background: #fff; }
  input[readonly] { background: #eef1f6; }
  fieldset { border: 0; margin: 0; padding: 0; }
  .opciones { display: flex; gap: 8px; }
  .opciones label { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0; padding: 12px; font-size: 15px;
    color: #1a1f2b; border: 1px solid var(--linea); border-radius: 10px; cursor: pointer; min-height: 48px; }
  .opciones input { width: auto; }
  #codigo { font-family: ui-monospace, monospace; font-size: 18px; border: 2px solid var(--azul); }
  .fila { display: flex; gap: 8px; }
  .fila input { flex: 1; min-width: 0; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
  .boton { border: 1px solid var(--azul); background: #fff; color: var(--azul); border-radius: 10px; padding: 0 16px; min-height: 48px; font-size: 15px; font-weight: 700; }
  .boton.chico { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .boton.rojo { border-color: var(--rojo); color: var(--rojo); }
  .boton.relleno { background: var(--azul); color: #fff; }
  a.boton { display: inline-flex; align-items: center; text-decoration: none; }
  a.boton.wa { background: #128C4A; border-color: #128C4A; color: #fff; }
  #apartar { width: 100%; margin-top: 14px; padding: 16px; font-size: 19px; font-weight: 800; border: 0; border-radius: 12px; background: var(--verde); color: #fff; }
  #apartar:disabled { background: #c8cfda; cursor: not-allowed; }
  .pieza { display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--linea); }
  .pieza .codigo, .nota { font-size: 12px; color: #78839a; }
  .pieza .codigo { font-family: ui-monospace, monospace; }
  .pieza button { border: 0; background: none; color: var(--rojo); font-size: 20px; min-height: 44px; }
  .cifras { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .cifras td { padding: 3px 2px; font-size: 15px; }
  .cifras td:last-child { text-align: right; }
  .cifras .fuerte td { font-weight: 800; font-size: 18px; }
  .aviso { min-height: 20px; margin-top: 8px; font-size: 14px; }
  .aviso.error { color: var(--rojo); }
  .aviso.ok { color: var(--verde); }
  #listo { text-align: center; border: 2px solid var(--verde); }
  #listo .folio { font-size: 64px; font-weight: 800; color: var(--azul); letter-spacing: -1px; line-height: 1.1; }
  #listo .acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  #listo[hidden] { display: none; }
  .pedido { border-top: 1px solid var(--linea); padding: 10px 2px; display: grid; gap: 4px; font-size: 14px; }
  .pedido:first-of-type { border-top: 0; }
  .pedido .cabeza { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .pedido .folio { font-size: 20px; font-weight: 800; color: var(--azul); }
  .pedido .piezas { color: #5b6478; font-size: 13px; }
  .pedido .vence.urgente { color: var(--rojo); font-weight: 700; }
  .pedido .botones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .pedido .guia { display: flex; gap: 8px; flex: 1 1 260px; }
  .pedido .guia input { padding: 8px 10px; font-size: 15px; }
  .vacio { color: #78839a; font-size: 14px; margin: 4px 0; }
  dialog { border: 2px solid var(--azul); border-radius: 14px; padding: 18px 20px; width: min(440px, 94vw); }
  dialog::backdrop { background: rgba(22,54,107,.5); }
  dialog p { margin: 0 0 14px; font-size: 16px; }
  dialog .botones { display: flex; flex-direction: column; gap: 8px; }
  dialog .botones button { min-height: 52px; font-size: 17px; }
</style>
<script src="/cajero.js"></script>
</head>
<body>
<header>
  <h1>Pedidos por WhatsApp</h1>
  <label class="caja-nombre" id="caja-etiqueta">Esta computadora es
    <select id="caja-nombre">
      <option value="">— elige —</option>
      <option>Caja 1</option>
      <option>Caja 2</option>
      <option>Caja 3</option>
    </select>
  </label>
  <a href="/caja">Volver a la caja</a>
</header>

<main>
  <section>
    <div id="listo" class="panel" hidden aria-live="polite">
      <h2>Apartado registrado</h2>
      <div class="folio" id="listo-folio"></div>
      <p id="listo-resumen"></p>
      <div class="aviso" id="listo-aviso" role="status"></div>
      <div class="acciones">
        <a class="boton wa" id="listo-wa" target="_blank" rel="noopener">WhatsApp: confirmar</a>
        <button class="boton" id="otro-apartado" type="button">Nuevo apartado</button>
      </div>
    </div>

    <div class="panel" id="nuevo">
      <h2>Nuevo apartado</h2>
      <p class="nota" style="margin:0">Sin anticipo no hay apartado: el mínimo es $100 y las piezas se apartan 7 días.</p>
      <label for="codigo">Código de la pieza (ED-…, o solo los números)</label>
      <div class="fila">
        <input id="codigo" autocomplete="off" inputmode="text" placeholder="Escanea o escribe el código">
        <button class="boton" id="agregar" type="button">Agregar</button>
      </div>
      <div class="aviso" id="aviso-pieza" role="status"></div>
      <div id="piezas" aria-label="Piezas del apartado"></div>

      <form id="form-apartado" autocomplete="off" novalidate>
        <label for="cliente">Nombre del cliente</label>
        <input id="cliente" maxlength="80" required>
        <label for="telefono">WhatsApp (10 dígitos)</label>
        <input id="telefono" type="tel" inputmode="numeric" maxlength="16" required>

        <fieldset>
          <legend>Entrega</legend>
          <div class="opciones">
            <label><input type="radio" name="entrega" value="tienda" checked> Recoger en tienda</label>
            <label><input type="radio" name="entrega" value="envio"> Envío</label>
          </div>
        </fieldset>

        <table class="cifras" aria-live="polite">
          <tr><td>Piezas</td><td id="c-subtotal">$0</td></tr>
          <tr><td id="c-envio-etiqueta">Envío</td><td id="c-envio">—</td></tr>
          <tr class="fuerte"><td>Total</td><td id="c-total">$0</td></tr>
        </table>

        <label for="anticipo">Anticipo recibido ($)</label>
        <input id="anticipo" type="number" min="100" step="0.01" inputmode="decimal">
        <div class="nota" id="anticipo-ayuda"></div>

        <label for="forma">Forma de pago del anticipo</label>
        <select id="forma">
          <option value="transferencia">Transferencia</option>
          <option value="tarjeta">Tarjeta (terminal)</option>
          <option value="efectivo">Efectivo</option>
        </select>

        <button id="apartar" type="submit" disabled>Apartar</button>
        <div class="aviso" id="aviso" role="status"></div>
      </form>
    </div>
  </section>

  <section class="panel">
    <div class="fila" style="align-items:center">
      <h2 style="flex:1;margin:0">Pedidos</h2>
      <button class="boton chico" id="actualizar" type="button">Actualizar</button>
    </div>
    <div class="aviso" id="aviso-lista" role="status"></div>
    <div class="aviso error" id="aviso-red" role="status"></div>
    <h3>Apartados</h3>
    <div id="lista-apartados"></div>
    <h3>Por enviar</h3>
    <div id="lista-envios"></div>
    <h3>Saldos a favor</h3>
    <div id="lista-saldos"></div>
  </section>
</main>

<dialog id="dlg-cancelar" aria-labelledby="dlg-cancelar-titulo">
  <h2 id="dlg-cancelar-titulo">¿Cancelar el apartado?</h2>
  <p id="dlg-cancelar-texto"></p>
  <div class="botones">
    <button class="boton rojo" id="dlg-cancelar-si" type="button">Sí, cancelar apartado</button>
    <button class="boton" id="dlg-cancelar-no" type="button" autofocus>No, regresar</button>
  </div>
</dialog>

<script type="module">
import { envioDe, ANTICIPO_MINIMO } from '/venta.js';
import { codigoDeDigitos } from '/code128.js';

const $ = (id) => document.getElementById(id);
// Nombres, clientes y guías los escribe una persona: texto, nunca HTML.
const escapar = (texto) => String(texto ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const pesos = (centavos) => `$${(centavos / 100).toLocaleString('es-MX', { minimumFractionDigits: centavos % 100 ? 2 : 0, maximumFractionDigits: 2 })}`;
const ZONA = 'America/Mexico_City';
const fecha = (iso) => new Date(iso).toLocaleDateString('es-MX', { timeZone: ZONA, day: 'numeric', month: 'long', year: 'numeric' });
const dia = (instante) => new Date(instante).toLocaleDateString('en-CA', { timeZone: ZONA });
const decir = (id, texto, clase = '') => { $(id).textContent = texto; $(id).className = `aviso ${clase}`.trim(); };

/* ---------- que caja es esta computadora: la misma que recuerda /caja ---------- */

const CLAVE_CAJA = 'caja-nombre';
try { $('caja-nombre').value = localStorage.getItem(CLAVE_CAJA) ?? ''; } catch { /* sin memoria: se elige cada vez */ }
$('caja-nombre').addEventListener('change', () => {
  try { localStorage.setItem(CLAVE_CAJA, $('caja-nombre').value); } catch { /* idem */ }
  validar();
});
// La caja asignada por el dueño (o la del cajero que entró con PIN) manda sobre la elegida aquí.
fetch('/api/yo').then((r) => r.json()).then(({ usuario, cajero }) => {
  const caja = (cajero ?? usuario)?.caja;
  if (!caja) return;
  $('caja-nombre').value = caja;
  $('caja-nombre').disabled = true;
  $('caja-etiqueta').firstChild.textContent = 'Tu caja ';
  validar();
}).catch(() => { /* sin red: la de la computadora */ });

/* ---------- nuevo apartado ---------- */

let catalogo = new Map();
let piezas = [];            // { id, codigo, nombre, precio, stock, cantidad }
let idIntento = null;       // un solo id por intento: reintentar tras un fallo de red no duplica el apartado
let anticipoTocado = false;
let enviando = false;

async function cargarCatalogo() {
  try {
    const lista = await (await fetch('/api/catalogo')).json();
    catalogo = new Map(lista.map((p) => [p.codigo, p]));
  } catch { /* sin red: se avisa al buscar */ }
}

// La etiqueta impresa solo trae el numero ("123"): se reconstruye ED-000123, como en la caja.
function buscarPieza(leido) {
  const codigo = (codigoDeDigitos(leido) ?? leido).trim().toUpperCase();
  return catalogo.get(codigo) ?? (/^\d+$/.test(codigo) ? catalogo.get(`ED-${codigo.padStart(6, '0')}`) : undefined);
}

function agregarPieza(leido, reintento = false) {
  const texto = leido.trim();
  if (!texto) return;
  const pieza = buscarPieza(texto);
  if (!pieza) {
    decir('aviso-pieza', `Código no encontrado: ${texto}`, 'error');
    // Pudo etiquetarse después de abrir la página: se baja el catálogo y se reintenta una vez.
    if (!reintento && navigator.onLine) cargarCatalogo().then(() => { if (buscarPieza(texto)) agregarPieza(texto, true); });
    return;
  }
  if (pieza.sin_inventario) return decir('aviso-pieza', 'Solo piezas con etiqueta.', 'error');
  const enApartado = piezas.find((p) => p.id === pieza.id);
  if (pieza.stock - (enApartado?.cantidad ?? 0) <= 0) {
    return decir('aviso-pieza', enApartado ? `${pieza.nombre}: solo hay ${pieza.stock} en existencia.` : `${pieza.nombre} ya se vendió o está apartada.`, 'error');
  }
  if (enApartado) enApartado.cantidad++;
  else piezas.push({ id: pieza.id, codigo: pieza.codigo, nombre: pieza.nombre, precio: pieza.precio, stock: pieza.stock, cantidad: 1 });
  decir('aviso-pieza', `✓ ${pieza.nombre}`, 'ok');
  pintar();
}

$('codigo').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();   // el lector manda Enter: no debe enviar nada más
  agregarPieza(e.target.value);
  e.target.value = '';
});
$('agregar').addEventListener('click', () => { agregarPieza($('codigo').value); $('codigo').value = ''; $('codigo').focus(); });
$('piezas').addEventListener('click', (e) => {
  const i = e.target.closest('button')?.dataset.quitar;
  if (i === undefined) return;
  const pieza = piezas[Number(i)];
  if (pieza.cantidad > 1) pieza.cantidad--; else piezas.splice(Number(i), 1);
  pintar();
  $('codigo').focus();
});

const entrega = () => document.querySelector('input[name="entrega"]:checked').value;
const telefonoLimpio = () => {
  const digitos = $('telefono').value.replace(/\D/g, '');
  return digitos.length === 12 && digitos.startsWith('52') ? digitos.slice(2) : digitos;
};

/** Lo que vale el apartado y el anticipo escrito, en centavos, con el motivo si algo no deja apartar. */
function calcular() {
  const subtotal = piezas.reduce((suma, p) => suma + p.precio * p.cantidad, 0);
  const envio = entrega() === 'envio' ? envioDe(subtotal) : 0;
  const total = subtotal + envio;
  const anticipo = entrega() === 'envio' ? total : Math.round(Number($('anticipo').value || 0) * 100);
  let motivo = '';
  if (!piezas.length) motivo = 'Agrega al menos una pieza.';
  else if (total < ANTICIPO_MINIMO) motivo = `El apartado debe valer al menos ${pesos(ANTICIPO_MINIMO)}.`;
  else if (!($('cliente').value.trim())) motivo = 'Escribe el nombre del cliente.';
  else if (telefonoLimpio().length !== 10) motivo = 'El WhatsApp debe tener 10 dígitos.';
  else if (anticipo < ANTICIPO_MINIMO) motivo = `El anticipo mínimo es ${pesos(ANTICIPO_MINIMO)}.`;
  else if (anticipo > total) motivo = `El anticipo no puede pasar del total (${pesos(total)}).`;
  else if ($('forma').value === 'efectivo' && !$('caja-nombre').value) motivo = 'Para cobrar en efectivo elige arriba qué caja es esta computadora.';
  return { subtotal, envio, total, anticipo, motivo };
}

function pintar() {
  $('piezas').innerHTML = piezas.map((p, i) => `
    <div class="pieza">
      <div><div>${escapar(p.nombre)}${p.cantidad > 1 ? ` ×${p.cantidad}` : ''}</div><div class="codigo">${escapar(p.codigo)}</div></div>
      <div>${pesos(p.precio * p.cantidad)}</div>
      <button type="button" data-quitar="${i}" aria-label="Quitar ${escapar(p.nombre)}">✕</button>
    </div>`).join('');
  const envioElegido = entrega() === 'envio';
  // Envío exige pago completo; en tienda el anticipo se escribe (por omisión el mínimo).
  $('anticipo').readOnly = envioElegido;
  if (envioElegido) $('anticipo').value = String(calcular().total / 100);
  else if (!anticipoTocado) $('anticipo').value = String(ANTICIPO_MINIMO / 100);
  const c = calcular();
  $('c-subtotal').textContent = pesos(c.subtotal);
  $('c-envio-etiqueta').textContent = envioElegido ? 'Envío' : 'Entrega';
  $('c-envio').textContent = !envioElegido ? 'en tienda' : c.envio ? pesos(c.envio) : c.subtotal ? 'gratis' : '—';
  $('c-total').textContent = pesos(c.total);
  $('anticipo-ayuda').textContent = envioElegido ? 'El envío se paga completo: el anticipo es el total.' : `Mínimo ${pesos(ANTICIPO_MINIMO)}.`;
  validar();
}
function validar() {
  const c = calcular();
  $('apartar').disabled = enviando || !!c.motivo;
  if (!enviando && c.motivo && piezas.length) decir('aviso', c.motivo);
  else if (!enviando && !$('aviso').classList.contains('error')) decir('aviso', '');
}
for (const id of ['cliente', 'telefono', 'forma']) $(id).addEventListener('input', () => { quitarError(); validar(); });
$('anticipo').addEventListener('input', () => { anticipoTocado = true; quitarError(); pintar(); });
for (const r of document.querySelectorAll('input[name="entrega"]')) r.addEventListener('change', pintar);
const quitarError = () => { if ($('aviso').classList.contains('error')) decir('aviso', ''); };

/* ---------- mensajes de WhatsApp ---------- */

const enlaceWhatsApp = (telefono, texto) => `https://wa.me/52${telefono}?text=${encodeURIComponent(texto)}`;
const nombreDe = (p) => p.cliente.trim().split(/\s+/)[0];
const piezasDe = (p) => p.lineas.map((l) => (l.cantidad > 1 ? `${l.cantidad} × ${l.nombre}` : l.nombre)).join(', ');
const totalDe = (p) => p.subtotal + p.envio;

const mensajeConfirmar = (p) => `¡Hola ${nombreDe(p)}! Tu apartado P-${p.folio} en El Dolarón quedó registrado: ${piezasDe(p)}. `
  + `Anticipo recibido: ${pesos(p.anticipo)}. Total: ${pesos(totalDe(p))}. `
  + (p.entrega === 'envio'
    ? 'Pagado completo. Te avisamos cuando salga tu paquete.'
    : `Recógelo en Jardín Hidalgo #129 a más tardar el ${fecha(p.vence_en)}. Si no lo recoges a tiempo, tu anticipo queda como saldo a favor por 1 mes.`);
const mensajeRecordar = (p) => `Hola ${nombreDe(p)}, te recordamos que tu apartado P-${p.folio} vence el ${fecha(p.vence_en)}. ¡Te esperamos!`;
const mensajeSaldo = (p) => `Hola ${nombreDe(p)}, tu apartado P-${p.folio} venció. Tu anticipo quedó como saldo a favor de ${pesos(p.saldo)} hasta el ${fecha(p.saldo_vence_en)}: menciona P-${p.folio} en caja.`;
const mensajeGuia = (p) => `Hola ${nombreDe(p)}, tu pedido P-${p.folio} ya va en camino. Número de guía: ${p.guia}.`;

/* ---------- crear ---------- */

$('form-apartado').addEventListener('submit', async (e) => {
  e.preventDefault();
  const c = calcular();
  if (enviando || c.motivo) return;
  enviando = true;
  $('apartar').disabled = true;
  decir('aviso', 'Apartando…');
  idIntento ??= crypto.randomUUID();
  const cuerpo = {
    id: idIntento,
    lineas: piezas.map((p) => ({ producto_id: p.id, cantidad: p.cantidad })),
    cliente: $('cliente').value.trim(), telefono: telefonoLimpio(), entrega: entrega(),
    anticipo: c.anticipo, forma_pago: $('forma').value, caja: $('caja-nombre').value,
  };
  let r, datos;
  try {
    r = await fetch('/api/pedidos', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) });
    datos = await r.json();
  } catch {
    // Respuesta desconocida: el mismo id evita duplicar si el servidor sí lo guardó.
    enviando = false;
    validar();
    return decir('aviso', 'Sin red: no se sabe si se guardó. Toca «Apartar» otra vez; no se duplica.', 'error');
  }
  enviando = false;
  if (!r.ok) {
    validar();
    decir('aviso', datos.error ?? 'No se pudo apartar.', 'error');
    if (r.status === 409) cargarCatalogo();   // alguna pieza ya no está: el catálogo se actualiza
    return;
  }
  mostrarListo(datos.pedido, cuerpo.forma_pago);
});

function mostrarListo(p, forma) {
  idIntento = null;
  piezas = [];
  anticipoTocado = false;
  for (const id of ['cliente', 'telefono']) $(id).value = '';
  document.querySelector('input[name="entrega"][value="tienda"]').checked = true;
  $('forma').value = 'transferencia';
  decir('aviso', '');
  decir('aviso-pieza', '');
  pintar();
  $('listo-folio').textContent = `P-${p.folio}`;
  $('listo-resumen').textContent = `${p.cliente} · ${piezasDe(p)} · anticipo ${pesos(p.anticipo)} de ${pesos(totalDe(p))}`
    + (p.entrega === 'tienda' ? ` · vence el ${fecha(p.vence_en)}` : ' · envío pagado completo');
  $('listo-wa').href = enlaceWhatsApp(p.telefono, mensajeConfirmar(p));
  decir('listo-aviso', '');
  $('listo').hidden = false;
  $('listo-wa').focus();
  $('listo').scrollIntoView({ block: 'nearest' });
  cargarLista();
  cargarCatalogo();
  // ponytail: sin abrir el cajon desde aqui; tomar el USB en esta pestana se lo quita a /caja.
  if (forma === 'efectivo') decir('listo-aviso', 'Guarda el anticipo en el cajón: ábrelo con «Abrir cajón» en la caja.', 'ok');
}
$('otro-apartado').addEventListener('click', () => { $('listo').hidden = true; $('codigo').focus(); });

/* ---------- listas ---------- */

let pedidos = [];
const guardadas = new Map();   // folio -> pedido con guía recién guardada: sigue a la vista con su botón de WhatsApp hasta recargar la página

async function cargarLista() {
  try {
    const r = await fetch('/api/pedidos');
    const cuerpo = await r.json();
    if (!r.ok) throw new Error(cuerpo.error);
    pedidos = cuerpo.pedidos;
    $('aviso-red').textContent = '';
  } catch {
    $('aviso-red').textContent = 'Sin red: no se pudo actualizar la lista.';
  }
  pintarLista();
}

const vendedoraDe = (p) => escapar(String(p.vendedora ?? '').split('@')[0]);

function filaPedido(p, { botones, vence }) {
  return `<div class="pedido">
    <div class="cabeza"><span class="folio">P-${p.folio}</span><span><b>${escapar(p.cliente)}</b> · ${escapar(p.telefono)}</span></div>
    <div class="piezas">${escapar(piezasDe(p))}</div>
    <div>${p.estado === 'apartado' ? `Anticipo ${pesos(p.anticipo)} de ${pesos(totalDe(p))}` : `Saldo ${pesos(p.saldo)}`} · ${p.entrega === 'envio' ? 'Envío' : 'Tienda'} · ${vendedoraDe(p)}</div>
    ${vence}
    <div class="botones">${botones}</div>
  </div>`;
}
const botonWa = (p, texto, etiqueta) => `<a class="boton chico wa" target="_blank" rel="noopener" href="${enlaceWhatsApp(p.telefono, texto)}">${etiqueta}</a>`;

function pintarLista() {
  const ahora = Date.now();
  const hoy = dia(ahora);
  const apartados = pedidos.filter((p) => p.estado === 'apartado');
  const envios = pedidos.filter((p) => p.estado === 'vendido' && p.entrega === 'envio' && !p.guia).map((p) => guardadas.get(p.folio) ?? p);
  for (const p of guardadas.values()) if (!envios.some((x) => x.folio === p.folio)) envios.push(p);
  const saldos = pedidos.filter((p) => p.estado !== 'apartado' && p.saldo > 0 && Date.parse(p.saldo_vence_en) > ahora);

  $('lista-apartados').innerHTML = apartados.map((p) => {
    const vencido = Date.parse(p.vence_en) <= ahora;
    const urgente = vencido || dia(Date.parse(p.vence_en)) === hoy;
    return filaPedido(p, {
      vence: `<div class="vence ${urgente ? 'urgente' : ''}">${vencido ? 'Venció el' : dia(Date.parse(p.vence_en)) === hoy ? 'Vence hoy,' : 'Vence el'} ${fecha(p.vence_en)}</div>`,
      botones: botonWa(p, mensajeRecordar(p), 'WhatsApp: recordar')
        + `<button class="boton chico rojo" type="button" data-cancelar="${p.folio}">Cancelar apartado</button>`,
    });
  }).join('') || '<p class="vacio">No hay apartados.</p>';

  $('lista-envios').innerHTML = envios.map((p) => filaPedido(p, {
    vence: '',
    botones: guardadas.has(p.folio)
      ? `<span class="aviso ok">Guía ${escapar(p.guia)} guardada.</span>` + botonWa(p, mensajeGuia(p), 'WhatsApp: avisar guía')
      : `<form class="guia" data-guia="${p.folio}">
           <input aria-label="Número de guía de P-${p.folio}" maxlength="60" placeholder="Número de guía" required>
           <button class="boton chico relleno" type="submit">Guardar guía</button>
         </form>`,
  })).join('') || '<p class="vacio">No hay pedidos por enviar.</p>';

  $('lista-saldos').innerHTML = saldos.map((p) => filaPedido(p, {
    vence: `<div class="vence">Saldo vigente hasta el ${fecha(p.saldo_vence_en)}</div>`,
    botones: botonWa(p, mensajeSaldo(p), 'WhatsApp: avisar saldo'),
  })).join('') || '<p class="vacio">No hay saldos a favor.</p>';
}

$('actualizar').addEventListener('click', cargarLista);
setInterval(() => { if (document.visibilityState === 'visible' && !$('dlg-cancelar').open) cargarLista(); }, 60000);

// Guardar guía (solo envíos).
$('lista-envios').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target.closest('form[data-guia]');
  if (!form) return;
  const guia = form.querySelector('input').value.trim();
  if (!guia) return;
  const boton = form.querySelector('button');
  boton.disabled = true;
  try {
    const r = await fetch(`/api/pedidos/${form.dataset.guia}/guia`, {
      method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ guia }),
    });
    const cuerpo = await r.json();
    if (!r.ok) { decir('aviso-lista', cuerpo.error ?? 'No se pudo guardar la guía.', 'error'); boton.disabled = false; return; }
    guardadas.set(cuerpo.pedido.folio, cuerpo.pedido);
    decir('aviso-lista', '');
    pintarLista();
  } catch {
    decir('aviso-lista', 'Sin red: la guía no se guardó. Intenta otra vez.', 'error');
    boton.disabled = false;
  }
});

/* ---------- cancelar un apartado: ventana propia, nada de confirm() ---------- */

let folioACancelar = null;
let botonOrigen = null;
$('lista-apartados').addEventListener('click', (e) => {
  const boton = e.target.closest('button[data-cancelar]');
  if (!boton) return;
  const p = pedidos.find((x) => x.folio === Number(boton.dataset.cancelar));
  if (!p) return;
  folioACancelar = p.folio;
  botonOrigen = boton;
  $('dlg-cancelar-titulo').textContent = `¿Cancelar el apartado P-${p.folio}?`;
  $('dlg-cancelar-texto').textContent = `Las piezas vuelven a la venta y el anticipo de ${pesos(p.anticipo)} queda como saldo a favor de ${p.cliente} por 1 mes.`;
  $('dlg-cancelar-si').disabled = false;
  $('dlg-cancelar').showModal();
});
$('dlg-cancelar-no').addEventListener('click', () => $('dlg-cancelar').close());
$('dlg-cancelar').addEventListener('close', () => { folioACancelar = null; botonOrigen?.focus(); });
$('dlg-cancelar-si').addEventListener('click', async () => {
  if (folioACancelar === null) return;
  $('dlg-cancelar-si').disabled = true;
  const folio = folioACancelar;
  try {
    const r = await fetch(`/api/pedidos/${folio}/cancelar`, { method: 'POST' });
    const cuerpo = await r.json().catch(() => ({}));
    $('dlg-cancelar').close();
    if (!r.ok) decir('aviso-lista', cuerpo.error ?? `No se pudo cancelar P-${folio}.`, 'error');
    else decir('aviso-lista', `P-${folio} cancelado. Su anticipo quedó en «Saldos a favor»: avísale por WhatsApp.`, 'ok');
  } catch {
    $('dlg-cancelar').close();
    decir('aviso-lista', 'Sin red: no se canceló. Intenta otra vez.', 'error');
  }
  cargarLista();
  cargarCatalogo();
});

pintar();
await cargarCatalogo();
await cargarLista();
$('codigo').focus();
</script>
</body>
</html>
