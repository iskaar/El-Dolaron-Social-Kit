<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Dolarón — caja</title>
<style>
  :root { --azul:#16366B; --rojo:#D72B32; --verde:#1f7a4d; --linea:#dfe3ea; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #f4f6f9; color: #1a1f2b; font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; }
  header { background: var(--azul); color: #fff; padding: 10px 18px;
    display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header a { color: #FFD447; font-size: 13px; }
  #estado-red { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #ffffff22; }
  #estado-red.sin-red { background: var(--rojo); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 16px; min-height: 0; }
  .panel { background: #fff; border: 1px solid var(--linea); border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; min-height: 0; }
  #codigo { width: 100%; padding: 14px; font-size: 20px; border: 2px solid var(--azul);
    border-radius: 10px; font-family: ui-monospace, monospace; }
  #sugerencias { margin: 8px 0 4px; display: flex; flex-direction: column; gap: 4px; }
  #sugerencias button { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px;
    font-size: 15px; border: 1px solid var(--linea); border-radius: 8px; background: #fff; cursor: pointer;
    text-align: left; }
  #sugerencias button:active { background: #eef1f6; }
  #sugerencias .codigo { font-family: ui-monospace, monospace; color: #78839a; }
  #ticket { flex: 1; overflow-y: auto; margin-top: 4px; }
  .renglon { display: grid; grid-template-columns: 1fr 52px 90px 32px; gap: 8px; align-items: center;
    padding: 9px 4px; border-bottom: 1px solid var(--linea); }
  .renglon .nombre { font-size: 15px; }
  .renglon .codigo { font-size: 11px; color: #78839a; font-family: ui-monospace, monospace; }
  .renglon .importe { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .renglon button { border: 0; background: none; color: var(--rojo); font-size: 18px; cursor: pointer; }
  #total { font-size: 44px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  #piezas { color: #5b6478; font-size: 13px; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: #5b6478; margin: 10px 0 4px; }
  select, #efectivo { width: 100%; padding: 12px; font-size: 18px; border: 1px solid var(--linea);
    border-radius: 10px; }
  #cambio { font-size: 22px; font-weight: 700; margin-top: 10px; min-height: 30px; }
  #cambio.falta { color: var(--rojo); }
  #cambio.ok { color: var(--verde); }
  #cobrar { width: 100%; margin-top: 12px; padding: 18px; font-size: 20px; font-weight: 800;
    border: 0; border-radius: 12px; background: var(--verde); color: #fff; cursor: pointer; }
  #cobrar:disabled { background: #c8cfda; cursor: not-allowed; }
  #abrir-cajon { width: 100%; margin-top: 8px; padding: 10px; font-size: 14px; border: 1px solid var(--azul);
    background: #fff; color: var(--azul); border-radius: 10px; cursor: pointer; }
  #cancelar { width: 100%; margin-top: 8px; padding: 10px; font-size: 14px; border: 1px solid var(--rojo);
    background: #fff; color: var(--rojo); border-radius: 10px; cursor: pointer; }
  #aviso { min-height: 20px; font-size: 14px; margin-top: 8px; }
  #rechazadas:not(:empty) { margin-top: 8px; }
  #rechazadas .ticket { border: 1px solid var(--rojo); border-radius: 8px; padding: 8px;
    margin-bottom: 6px; font-size: 13px; color: var(--rojo); }
  #rechazadas .ticket button { margin-left: 6px; }
  #pie { padding: 8px 18px 14px; font-size: 13px; color: #5b6478; display: flex; gap: 18px; flex-wrap: wrap; }
  #tickets { margin-top: 14px; border-top: 1px solid var(--linea); padding-top: 10px; }
  #tickets summary { font-size: 13px; color: #5b6478; cursor: pointer; }
  #lista-tickets { max-height: 220px; overflow-y: auto; margin-top: 8px; }
  .ticket { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center;
    padding: 8px 2px; border-bottom: 1px solid var(--linea); font-size: 13px; }
  .ticket .piezas { color: #78839a; font-size: 11px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 190px; }
  .ticket.cancelada { opacity: .5; text-decoration: line-through; }
  .ticket button { border: 1px solid var(--rojo); background: #fff; color: var(--rojo);
    border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
  .socio-fila { display: flex; gap: 6px; }
  #socio { flex: 1; min-width: 0; padding: 12px; font-size: 18px; border: 1px solid var(--linea); border-radius: 10px; }
  .socio-fila button { border: 1px solid var(--azul); background: #fff; color: var(--azul); border-radius: 10px;
    padding: 0 14px; font-size: 14px; cursor: pointer; }
  #socio-info { font-size: 14px; margin-top: 6px; min-height: 18px; }
  #socio-info b { color: var(--azul); }
  #dolarones, #pin { width: 100%; padding: 12px; font-size: 18px; border: 1px solid var(--linea); border-radius: 10px; }
  #a-pagar { font-size: 18px; font-weight: 700; color: var(--azul); min-height: 22px; }
  .caja-nombre { font-size: 13px; display: flex; align-items: center; gap: 6px; color: #fff; margin: 0; }
  .caja-nombre select { width: auto; padding: 4px 8px; font-size: 14px; border-radius: 8px; border: 0; }
  header button { border: 1px solid #FFD447; background: transparent; color: #FFD447; border-radius: 8px;
    padding: 5px 12px; font-size: 13px; cursor: pointer; }
  dialog { border: 0; border-radius: 14px; padding: 18px 20px; width: min(560px, 94vw); max-height: 92vh; }
  dialog::backdrop { background: #16366b99; }
  dialog h2 { margin: 0 0 8px; font-size: 20px; color: var(--azul); }
  dialog .nota { font-size: 13px; color: #5b6478; margin: 4px 0 10px; }
  dialog input { width: 100%; padding: 10px; font-size: 17px; border: 1px solid var(--linea); border-radius: 10px; }
  dialog .acciones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  dialog .acciones button { padding: 12px 16px; font-size: 15px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--azul); color: #fff; font-weight: 700; }
  dialog .acciones button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); font-weight: 400; }
  dialog .acciones button:disabled { background: #c8cfda; cursor: not-allowed; }
  .abrir-para-contar { width: 100%; padding: 12px; font-size: 16px; border: 1px solid var(--azul); background: #fff;
    color: var(--azul); border-radius: 10px; cursor: pointer; margin: 4px 0; }
  .aviso-dialogo { min-height: 18px; font-size: 14px; color: var(--rojo); margin-top: 8px; }
  #corte-efectivo { font-size: 26px; font-weight: 700; padding: 12px; }
  .tipo-salida { display: flex; gap: 8px; margin: 4px 0 6px; }
  .tipo-salida label { flex: 1; display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 12px; font-size: 15px;
    color: #1a1f2b; border: 1px solid var(--linea); border-radius: 10px; cursor: pointer; }
  .tipo-salida input { width: auto; }
  #corte-resumen table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  #corte-resumen td { padding: 4px 2px; border-bottom: 1px solid var(--linea); }
  #corte-resumen td:last-child { text-align: right; }
  #corte-resumen .fuerte td { font-weight: 800; font-size: 18px; }
  #corte-resumen .falta td { color: var(--rojo); font-weight: 800; }
  #corte-resumen .sobra td { color: #b26b00; font-weight: 800; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
<script src="/cajero.js"></script>
</head>
<body>
<header>
  <h1>Caja</h1>
  <label class="caja-nombre">Esta computadora es
    <select id="caja-nombre">
      <option value="">— elige —</option>
      <option>Caja 1</option>
      <option>Caja 2</option>
      <option>Caja 3</option>
    </select>
  </label>
  <span id="estado-red">en línea</span>
  <button id="abrir-retiro" type="button">Gasto / retiro</button>
  <button id="abrir-corte" type="button">Corte</button>
  <a href="/socios">Alta de socios</a>
  <a href="/admin">Cola de revisión</a>
</header>

<main>
  <section class="panel">
    <input id="codigo" placeholder="Escanea el código, o busca por descripción o código" autocomplete="off" autofocus>
    <div id="sugerencias"></div>
    <div id="ticket"></div>

  <section class="panel">
    <div id="total">$0</div>
    <div id="piezas">0 piezas</div>
    <div id="a-pagar"></div>

    <label for="socio">Socio: teléfono o número</label>
    <div class="socio-fila">
      <input id="socio" inputmode="numeric" autocomplete="off" placeholder="Opcional">
      <button id="buscar-socio" type="button">Buscar</button>
      <button id="quitar-socio" type="button" hidden aria-label="Quitar socio">✕</button>
    </div>
    <div id="socio-info"></div>
    <p id="regla-regalo" aria-live="polite" hidden></p>
    <div id="pagar-dolarones" hidden>
      <label for="dolarones">Pagar con Dolarones</label>
      <input id="dolarones" type="number" min="0" step="1" inputmode="numeric" placeholder="0">

    <div id="cambio"></div>
    <button id="cobrar" type="button" disabled>Cobrar</button>
    <button id="cancelar" type="button">Cancelar venta</button>
    <button id="abrir-cajon" type="button">Abrir cajón</button>

</main>

<footer id="pie">
  <span id="corte">Hoy: —</span>

  <span id="impresora-estado"></span>
  <button id="conectar-impresora" type="button" hidden
    style="border:1px solid #dfe3ea;background:#fff;color:#1a1f2b;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">
    Conectar impresora
  </button>
</footer>

<dialog id="dialogo-retiro">
  <h2>Sale efectivo del cajón</h2>
  <div class="tipo-salida">
    <label><input type="radio" name="tipo-salida" value="gasto" checked> Gasto (hasta $100)</label>
    <label><input type="radio" name="tipo-salida" value="retiro"> Retiro (caja fuerte, banco)</label>

  <label for="retiro-motivo" id="retiro-etiqueta-motivo">Concepto</label>

  <div class="acciones">
    <button id="retiro-salir" type="button" class="secundario">Cancelar</button>
    <button id="retiro-registrar" type="button">Registrar y abrir cajón</button>

</dialog>

<dialog id="dialogo-corte">
  <h2>Corte de <span id="corte-caja"></span></h2>
  <div id="corte-paso-conteo">
    <p class="nota">Cuenta <b>todo</b> el efectivo del cajón, fondo incluido, y escribe el total. Lo que el
      sistema esperaba se ve después de registrarlo, y ya no se puede cambiar.</p>
    <button id="corte-abrir-cajon" type="button" class="abrir-para-contar">Abrir cajón para contar</button>
    <div class="aviso-dialogo" id="corte-aviso-cajon"></div>

    <label for="corte-notas">Notas (opcional)</label>

    <div class="acciones">
      <button id="corte-reimprimir" type="button" class="secundario">Reimprimir el último corte</button>
      <button id="corte-salir" type="button" class="secundario">Cancelar</button>
      <button id="corte-registrar" type="button">Registrar conteo</button>
    </div>
  </div>
  <div id="corte-paso-resultado" hidden>

      <button id="corte-imprimir" type="button" class="secundario">Imprimir otra vez</button>
      <button id="corte-cerrar" type="button">Cerrar</button>
    </div>
  </div>
</dialog>

<script type="module">
import { totales, agregar, efectivoAlcanza, dolaronesGanados, saldoCanjeable, MINIMO_REGALO } from '/venta.js';
import {
  reconectarImpresora, conectarImpresora, impresoraLista, imprimirTicket, abrirCajon, explicarErrorUsb, errorImpresora,
  imprimirCorte, imprimirRetiro,
} from '/impresora.js';

const $ = (id) => document.getElementById(id);
// Nombres de piezas (los escribe la IA o el admin), de socios y motivos: texto, nunca HTML.
const escapar = (texto) => String(texto ?? '').replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const pesos = (centavos) => `$${(centavos / 100).toLocaleString('es-MX')}`;

let catalogo = new Map();
let lineas = [];
// Un solo id por ticket: doble clic en Cobrar, o un reintento tras un fallo de
// red, reusan el mismo id en vez de crear una segunda venta. Cambiar el ticket
// (agregar, quitar, cancelar) lo invalida: eso ya es una venta distinta.
let idVenta = null;
let cobrando = false;
// Socio de la venta en curso: { id, numero, nombre, disponible, por_liberar, regalo_disponible } o null.
let socio = null;
const dolares = (centavos) => `${(centavos / 100).toLocaleString('es-MX')} D`;

/* ---------- que caja es esta computadora (Issue #100) ---------- */

// Cada venta, cancelacion, retiro y corte lleva la caja: el corte cuenta el
// dinero de un cajon. Se elige una vez por computadora y se recuerda aqui.
const CLAVE_CAJA = 'caja-nombre';
try { $('caja-nombre').value = localStorage.getItem(CLAVE_CAJA) ?? ''; } catch { /* sin memoria: se elige cada vez */ }
$('caja-nombre').addEventListener('change', () => {
  try { localStorage.setItem(CLAVE_CAJA, $('caja-nombre').value); } catch { /* idem */ }
  $('aviso').textContent = '';
  $('codigo').focus();
});
const cajaActual = () => $('caja-nombre').value;

// Issue #105: si el dueno le asigno una caja a quien entro, esa es la suya en
// cualquier computadora (el servidor la usa aunque aqui diga otra). Sin red se
// queda lo que se eligio en esta computadora. En la computadora de la tienda,
// la del cajero que entro con su PIN (Issue #112).
fetch('/api/yo').then((r) => r.json()).then(({ usuario, cajero }) => {
  const caja = (cajero ?? usuario)?.caja;
  if (!caja) return;
  $('caja-nombre').value = caja;
  $('caja-nombre').disabled = true;
  $('caja-nombre').title = 'Tu caja, asignada por el dueño';
  $('caja-nombre').closest('label').firstChild.textContent = 'Tu caja ';
}).catch(() => { /* sin red: la de la computadora */ });

function exigirCaja() {
  if (cajaActual()) return true;
  $('aviso').textContent = 'Elige arriba qué caja es esta computadora.';
  $('aviso').style.color = '#D72B32';
  $('caja-nombre').focus();
  return false;
}

/* ---------- almacen local: catalogo y ventas encoladas ---------- */

function base() {
  return new Promise((resolve, reject) => {
    const s = indexedDB.open('eldolaron-caja', 2);
    s.onupgradeneeded = () => {
      const existe = (nombre) => s.result.objectStoreNames.contains(nombre);
      if (!existe('ventas')) s.result.createObjectStore('ventas', { keyPath: 'id' });
      if (!existe('catalogo')) s.result.createObjectStore('catalogo', { keyPath: 'clave' });
      // Version 2: aperturas del cajon por registrar, igual que las ventas encoladas.
      if (!existe('cajon')) s.result.createObjectStore('cajon', { keyPath: 'id' });
    };
    s.onsuccess = () => resolve(s.result);
    s.onerror = () => reject(s.error);
  });
}

async function store(almacen, modo, fn) {
  const db = await base();
  return new Promise((resolve, reject) => {
    const req = fn(db.transaction(almacen, modo).objectStore(almacen));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ---------- catalogo: se cobra contra la copia local, no contra la red ---------- */

async function cargarCatalogo() {
  const guardado = await store('catalogo', 'readonly', (s) => s.get('piezas'));
  if (guardado) {
    catalogo = new Map(guardado.datos.map((p) => [p.codigo, p]));
    $('catalogo-info').textContent = `${catalogo.size} códigos en memoria`;
  }
  try {
    const piezas = await (await fetch('/api/catalogo')).json();
    catalogo = new Map(piezas.map((p) => [p.codigo, p]));
    await store('catalogo', 'readwrite', (s) => s.put({ clave: 'piezas', datos: piezas, fecha: Date.now() }));
    $('catalogo-info').textContent = `${catalogo.size} códigos · actualizado`;
  } catch {
    $('catalogo-info').textContent += ' · sin actualizar';
  }
}

/* ---------- ticket ---------- */

function pintar() {
  $('ticket').innerHTML = lineas.map((l, i) => `
    <div class="renglon">
      <div><div class="nombre">${escapar(l.nombre)}</div><div class="codigo">${escapar(l.codigo)}</div></div>
      <div>x${l.cantidad}</div>
      <div class="importe">${pesos(l.precio * l.cantidad)}</div>
      <button type="button" data-quitar="${i}" aria-label="Quitar">✕</button>
    </div>`).join('');

  const efectivo = Math.round(Number($('efectivo').value || 0) * 100);
  const usados = dolaronesPedidos();
  const t = totales(lineas, efectivo, usados);
  $('total').textContent = pesos(t.total);
  $('piezas').textContent = `${t.piezas} ${t.piezas === 1 ? 'pieza' : 'piezas'}`;
  $('a-pagar').textContent = usados ? `Dolarones −${pesos(usados)} · A pagar ${pesos(t.aPagar)}` : '';
  const canjeable = saldoCanjeable(socio, t.total);
  $('cobrar').disabled = cobrando || t.total === 0 || usados > canjeable;
  $('regla-regalo').hidden = !socio?.regalo_disponible;
  $('regla-regalo').textContent = socio?.regalo_disponible
    ? `${dolares(socio.regalo_disponible)} de apertura: ticket mínimo de ${pesos(MINIMO_REGALO)} MXN antes de descontar Dolarones. Puedes usar ${dolares(Math.min(canjeable, t.total))} en este ticket.`
      + (usados > canjeable ? ' Reduce los Dolarones solicitados o agrega productos.' : '')
    : '';

  const cambio = $('cambio');
  if (!efectivo || $('forma').value !== 'efectivo') {
    cambio.textContent = '';
  } else if (t.falta > 0) {
    cambio.textContent = `Faltan ${pesos(t.falta)}`;
    cambio.className = 'falta';
  } else {
    cambio.textContent = `Cambio ${pesos(t.cambio)}`;
    cambio.className = 'ok';
  }
}

/**
 * La etiqueta impresa codifica solo el numero (ver etiquetas.html: "123", no
 * "ED-000123") porque el codigo completo no cabe legible en 57 mm a un modulo
 * que el lector realmente sonara. El catalogo sigue guardando el codigo
 * completo, asi que un numero suelto se reconstruye antes de buscar.
 */
function buscarPieza(codigo) {
  const limpio = codigo.trim().toUpperCase();
  if (catalogo.has(limpio)) return catalogo.get(limpio);
  if (/^\d+$/.test(limpio)) return catalogo.get(`ED-${limpio.padStart(6, '0')}`);
  return undefined;
}

function agregarCodigo(codigo) {
  const pieza = buscarPieza(codigo);
  if (!pieza) {
    $('aviso').textContent = `Código no encontrado: ${codigo}`;
    $('aviso').style.color = '#D72B32';
    return;
  }

  // Las piezas son unicas: si ya se vendio, escanear su etiqueta otra vez seria
  // cobrar algo que no esta en el anaquel y dejar el inventario en negativo.
  if (!pieza.sin_inventario) {
    const enTicket = lineas
      .filter((l) => l.codigo === pieza.codigo)
      .reduce((suma, l) => suma + l.cantidad, 0);
    if (pieza.stock - enTicket <= 0) {
      $('aviso').textContent = enTicket > 0
        ? `${pieza.nombre}: solo hay ${pieza.stock} en existencia.`
        : `${pieza.nombre} ya se vendió. Revisa la etiqueta.`;
      $('aviso').style.color = '#D72B32';
      return;
    }
  }

  lineas = agregar(lineas, {
    codigo: pieza.codigo, nombre: pieza.nombre, precio: pieza.precio, producto_id: pieza.id,
  });
  idVenta = null;
  $('aviso').textContent = '';
  pintar();
}

/* ---------- busqueda a mano ---------- */

// Las bandas ya no tienen botones: se cobran escaneando su etiqueta como
// cualquier pieza, y si el codigo no lee se busca aqui por la descripcion
// generica ("juguetes 49") o por el codigo.
const sinAcentos = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function buscarPorTexto(texto) {
  const palabras = sinAcentos(texto).split(/\s+/).filter(Boolean);
  if (palabras.length === 0) return [];
  // Primero los que traen las palabras completas: "49" pone $49 antes que $149.
  const enteras = (p) => {
    const suyas = new Set(sinAcentos(`${p.nombre} ${p.codigo}`).split(/[^a-z0-9]+/));
    return palabras.filter((w) => suyas.has(w)).length;
  };
  return [...catalogo.values()]
    .filter((p) => { const paja = sinAcentos(`${p.nombre} ${p.codigo}`); return palabras.every((w) => paja.includes(w)); })
    .sort((a, b) => enteras(b) - enteras(a))
    .slice(0, 10);
}

function pintarSugerencias() {
  const texto = $('codigo').value;
  const piezas = texto.trim().length >= 2 && !buscarPieza(texto) ? buscarPorTexto(texto) : [];
  $('sugerencias').innerHTML = piezas.map((p) => `
    <button type="button" data-codigo="${escapar(p.codigo)}">
      <span>${escapar(p.nombre)}</span><span class="codigo">${escapar(p.codigo)} · ${pesos(p.precio)}</span>
    </button>`).join('');
}

$('codigo').addEventListener('input', pintarSugerencias);
$('sugerencias').addEventListener('click', (e) => {
  const codigo = e.target.closest('button')?.dataset.codigo;
  if (!codigo) return;
  agregarCodigo(codigo);
  $('codigo').value = '';
  pintarSugerencias();
  $('codigo').focus();
});

/* ---------- socio y Dolarones ---------- */

/** Dolarones a usar, en centavos. Nunca mas que el saldo ni que el total. */
function dolaronesPedidos() {
  if (!socio) return 0;
  const pedidos = Math.round(Number($('dolarones').value || 0) * 100);
  return Math.max(0, Math.min(pedidos, socio.disponible, totales(lineas).total));
}

function pintarSocio() {
  $('quitar-socio').hidden = !socio;
  $('pagar-dolarones').hidden = !socio || socio.disponible === 0;
  $('socio-info').innerHTML = socio
    ? `<b>#${socio.numero} · ${escapar(socio.nombre)}</b> — ${dolares(socio.disponible)} disponibles`
      + (socio.por_liberar ? ` (+${dolares(socio.por_liberar)} desde mañana)` : '')
    : '';
}

function quitarSocio() {
  socio = null;
  $('socio').value = '';
  $('dolarones').value = '';
  $('pin').value = '';
  pintarSocio();
}

async function buscarSocio() {
  const q = $('socio').value.trim();
  if (!q) return;
  try {
    const r = await fetch(`/api/socios?q=${encodeURIComponent(q)}`);
    const cuerpo = await r.json();
    if (!r.ok) {
      socio = null;
      pintarSocio();
      $('socio-info').textContent = cuerpo.error ?? 'No se encontró el socio.';
      $('socio-info').style.color = '#D72B32';
      return;
    }
    socio = cuerpo;
    idVenta = null;
    $('socio-info').style.color = '';
    pintarSocio();
    pintar();
  } catch {
    // Sin red no hay saldo que consultar: la venta se cobra sin socio y no gana.
    $('socio-info').textContent = 'Sin red: no se pueden buscar socios. Cobra sin socio.';
    $('socio-info').style.color = '#D72B32';
  }
}

$('buscar-socio').addEventListener('click', buscarSocio);
$('socio').addEventListener('keydown', (e) => { if (e.key === 'Enter') buscarSocio(); });
$('quitar-socio').addEventListener('click', () => { quitarSocio(); idVenta = null; pintar(); });
$('dolarones').addEventListener('input', () => { idVenta = null; pintar(); });

/**
 * Con Dolarones el cobro espera al servidor: el saldo solo existe alla, y
 * mostrar "cobrado" antes de que lo confirme dejaria gastar dos veces. El PIN
 * nunca se guarda en el disco de la caja.
 */
async function cobrarConDolarones(venta, t) {
  const pin = $('pin').value;
  if (!/^\d{4}$/.test(pin)) {
    $('aviso').textContent = 'Falta el PIN del cliente (4 dígitos).';
    $('aviso').style.color = '#D72B32';
    return false;
  }
  let respuesta;
  try {
    respuesta = await fetch('/api/ventas', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...venta, pin }),
    });
  } catch {
    $('aviso').textContent = 'Sin red: no se pudo cobrar con Dolarones. Intenta otra vez o cobra sin Dolarones.';
    $('aviso').style.color = '#D72B32';
    return false;
  }
  const cuerpo = await respuesta.json().catch(() => ({}));
  if (!respuesta.ok) {
    $('aviso').textContent = cuerpo.error ?? 'No se pudo cobrar con Dolarones.';
    $('aviso').style.color = '#D72B32';
    if (respuesta.status === 403) $('pin').value = '';
    return false;
  }
  // Un reenvio de la misma venta ya confirmada devuelve `duplicada` sin saldo: se imprime lo local.
  const saldo = cuerpo.saldo ?? { disponible: socio.disponible - venta.dolarones };
  return { numero: socio.numero, ganados: cuerpo.ganados ?? dolaronesGanados(t.aPagar), saldo: saldo.disponible };
}

/* ---------- cobro: primero al disco, luego a la red ---------- */

async function cobrar() {
  if (cobrando) return;                 // doble clic: el primero ya va en camino
  if (!exigirCaja()) return;
  const efectivo = Math.round(Number($('efectivo').value || 0) * 100);
  const forma = $('forma').value;
  const usados = dolaronesPedidos();
  const t = totales(lineas, efectivo, usados);
  if (usados > saldoCanjeable(socio, t.total)) {
    $('aviso').textContent = 'Los regalos de apertura requieren un ticket de $1,000 MXN o más antes de descontar Dolarones. Revisa el importe solicitado.';
    $('aviso').style.color = '#D72B32';
    return;
  }
  if (!efectivoAlcanza({ formaPago: forma, total: t.aPagar, efectivo })) {
    $('aviso').textContent = efectivo === 0 ? 'Falta el efectivo recibido.' : `Faltan ${pesos(t.falta)}`;
    $('aviso').style.color = '#D72B32';
    return;
  }

  cobrando = true;
  $('cobrar').disabled = true;
  try {
    idVenta ??= crypto.randomUUID();
    const venta = {
      id: idVenta,
      lineas: lineas.map(({ codigo, nombre, precio, cantidad, producto_id }) =>
        ({ codigo, nombre, precio, cantidad, producto_id })),
      forma_pago: forma,
      efectivo: forma === 'efectivo' ? efectivo : 0,
      creado_en: new Date().toISOString(),
      cliente_id: socio?.id ?? null,
      dolarones: usados,
      caja: cajaActual(),
    };
    let socioTicket = socio && { numero: socio.numero, ganados: dolaronesGanados(t.aPagar), saldo: socio.disponible };
    if (usados > 0) {
      socioTicket = await cobrarConDolarones(venta, t);
      if (!socioTicket) return;
    } else {
      await store('ventas', 'readwrite', (s) => s.put(venta));   // el ticket existe aunque no haya red
    }
    // El cajon primero: cajon y ticket van en fila por el mismo USB, y el cajero
    // no espera a que termine el logo. Una venta con tarjeta no toca el cajon.
    // Nada de esto espera al servidor ni bloquea el cobro; si falla, el pie lo dice.
    if (forma === 'efectivo') abrirCajon();
    imprimirTicket({ ...venta, total: t.total, cambio: t.cambio, socio: socioTicket }, venta.lineas)
      .then(pintarImpresora);

    // Bajar existencias en la copia local: sin esto, la misma etiqueta se podria
    // volver a cobrar mientras no haya red para refrescar el catalogo.
    for (const l of venta.lineas) {
      const pieza = catalogo.get(l.codigo);
      if (pieza && !pieza.sin_inventario) {
        pieza.stock = Math.max(0, pieza.stock - l.cantidad);
      }
    }
    await store('catalogo', 'readwrite', (s) => s.put({ clave: 'piezas', datos: [...catalogo.values()], fecha: Date.now() }));

    const ganados = socio ? dolaronesGanados(t.aPagar) : 0;
    $('aviso').textContent = (forma === 'efectivo' && efectivo > 0 ? `Cobrado. Cambio ${pesos(t.cambio)}` : 'Cobrado.')
      + (ganados ? ` · Ganó ${dolares(ganados)}` : '');
    $('aviso').style.color = '#1f7a4d';
    lineas = [];
    idVenta = null;
    quitarSocio();
    $('efectivo').value = '';
    $('codigo').focus();
    sincronizar();
  } finally {
    cobrando = false;
    pintar();
  }
}

let sincronizando = false;
async function sincronizar() {
  if (sincronizando) return;
  sincronizando = true;
  try {
    const cola = (await store('ventas', 'readonly', (s) => s.getAll()))
      .filter((v) => v.estado !== 'rechazada');   // esas ya no se reenvian solas
    for (const venta of cola) {
      let respuesta;
      try {
        respuesta = await fetch('/api/ventas', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(venta),
        });
      } catch {
        break;                                   // sin red: la venta se queda encolada
      }
      if (respuesta.status >= 500) break;
      if (respuesta.status >= 400) {
        // El servidor la rechazo (precio, existencia, efectivo insuficiente...):
        // se queda visible con su motivo, no desaparece como si se hubiera cobrado.
        const cuerpo = await respuesta.json().catch(() => ({}));
        await store('ventas', 'readwrite', (s) => s.put({
          ...venta, estado: 'rechazada', motivo: cuerpo.error ?? 'El servidor rechazo la venta.',
        }));
        continue;
      }
      await store('ventas', 'readwrite', (s) => s.delete(venta.id));
    }
    for (const apertura of await store('cajon', 'readonly', (s) => s.getAll())) {
      let respuesta;
      try {
        respuesta = await fetch('/api/cajon', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(apertura),
        });
      } catch {
        break;                                   // sin red: se registra al volver
      }
      if (respuesta.status >= 500) break;
      if (respuesta.status >= 400) console.error('Cajon: el servidor rechazo la apertura', apertura, respuesta.status);
      await store('cajon', 'readwrite', (s) => s.delete(apertura.id));
    }
  } finally {
    sincronizando = false;
    await pendientes();
    await pintarRechazadas();
    await actualizarCorte();
  }
}

async function pendientes() {
  const cola = await store('ventas', 'readonly', (s) => s.getAll());
  const porSincronizar = cola.filter((v) => v.estado !== 'rechazada');
  $('pendientes').textContent = porSincronizar.length ? `${porSincronizar.length} ventas por sincronizar` : '';
}

/** Ventas que el servidor rechazo: visibles con su motivo, y recuperables a mano. */
async function pintarRechazadas() {
  const rechazadas = (await store('ventas', 'readonly', (s) => s.getAll()))
    .filter((v) => v.estado === 'rechazada');
  $('rechazadas').innerHTML = rechazadas.map((v) => `
    <div class="ticket">
      <div><b>${pesos(totales(v.lineas).total)}</b> rechazada — ${escapar(v.motivo)}</div>
      <div>
        <button type="button" data-reintentar="${v.id}">Reintentar</button>
        <button type="button" data-descartar="${v.id}">Descartar</button>
      </div>
    </div>`).join('');
}
$('rechazadas').addEventListener('click', async (e) => {
  const reintentar = e.target.dataset?.reintentar;
  const descartar = e.target.dataset?.descartar;
  if (reintentar) {
    const venta = await store('ventas', 'readonly', (s) => s.get(reintentar));
    await store('ventas', 'readwrite', (s) => s.put({ ...venta, estado: undefined, motivo: undefined }));
    await pintarRechazadas();
    sincronizar();
  } else if (descartar) {
    await store('ventas', 'readwrite', (s) => s.delete(descartar));
    await pintarRechazadas();
  }
});

/** Devoluciones y errores de cobro. Necesita red: deshacer no puede quedar encolado. */
async function cargarTickets() {
  if (!$('tickets').open) return;
  try {
    const ventas = await (await fetch('/api/ventas?lista=1')).json();
    $('lista-tickets').innerHTML = ventas.length === 0
      ? '<p style="font-size:13px;color:#78839a">Todavía no hay ventas hoy.</p>'
      : ventas.map((v) => `
        <div class="ticket ${v.cancelada ? 'cancelada' : ''}">
          <div>
            <b>${pesos(v.total)}</b> · ${new Date(v.creado_en).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}
            <div class="piezas">${escapar(v.piezas)}</div>
          </div>
          ${v.cancelada ? '<span>cancelada</span>' : `<button type="button" data-cancelar="${v.id}">Cancelar</button>`}
        </div>`).join('');
  } catch {
    $('lista-tickets').innerHTML = '<p style="font-size:13px;color:#D72B32">Sin red: para cancelar una venta hace falta conexión.</p>';
  }
}

$('tickets').addEventListener('toggle', cargarTickets);
// Cancelar pide el motivo en la propia fila (nada de prompt()/confirm() nativos,
// que congelan la pestana): un clic abre el campo, otro clic ya confirmado envia.
$('lista-tickets').addEventListener('click', async (e) => {
  const idCancelar = e.target.dataset?.cancelar;
  const idConfirmar = e.target.dataset?.confirmarCancelar;
  const idVolver = e.target.dataset?.volverCancelar;

  if (idCancelar) {
    const fila = e.target.closest('.ticket');
    fila.innerHTML = `
      <input type="text" class="motivo-cancelacion" placeholder="Motivo de la cancelación"
        style="grid-column:1/-1;padding:8px;border:1px solid var(--linea);border-radius:8px;font-size:13px">
      <div style="grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end">
        <button type="button" data-volver-cancelar="${idCancelar}"
          style="border-color:var(--linea);color:#5b6478">Volver</button>
        <button type="button" data-confirmar-cancelar="${idCancelar}">Confirmar cancelación</button>
      </div>`;
    fila.querySelector('.motivo-cancelacion').focus();
    return;
  }
  if (idVolver) { await cargarTickets(); return; }
  if (idConfirmar) {
    const fila = e.target.closest('.ticket');
    const campoMotivo = fila.querySelector('.motivo-cancelacion');
    const motivo = campoMotivo.value.trim();
    if (!motivo) { campoMotivo.style.borderColor = 'var(--rojo)'; campoMotivo.focus(); return; }
    if (!exigirCaja()) return;
    e.target.disabled = true;
    // La caja donde se devuelve el dinero: su corte cuenta la devolucion.
    const r = await fetch(`/api/ventas/${idConfirmar}/cancelar`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ motivo, caja: cajaActual() }),
    });
    const cuerpo = await r.json();
    $('aviso').textContent = r.ok
      ? `Venta cancelada. Devuelve ${pesos(cuerpo.devuelto ?? 0)} y regresa la pieza al anaquel.`
        + (cuerpo.dolarones ? ` Los ${dolares(cuerpo.dolarones)} regresaron al saldo del socio.` : '')
      : (cuerpo.error ?? 'No se pudo cancelar.');
    $('aviso').style.color = r.ok ? '#1f7a4d' : '#D72B32';
    await cargarTickets();
    await actualizarCorte();
    await cargarCatalogo();          // la pieza devuelta vuelve a tener existencia
  }
});

// Sin importes a la vista: el conteo del corte es ciego (Issue #100). El dueno
// ve el dinero en /reportes.
async function actualizarCorte() {
  try {
    const c = await (await fetch('/api/ventas')).json();
    const tickets = c.por_forma_pago.reduce((suma, f) => suma + f.tickets, 0);
    $('corte').textContent = `Hoy: ${tickets} ${tickets === 1 ? 'venta' : 'ventas'} · ${c.piezas} piezas`;
  } catch { /* sin red, se ve cuando vuelva */ }
}

// Para cambiar billetes sin cobrar nada. Abre sin esperar al servidor (tiene

/* ---------- gasto o retiro de efectivo (Issue #100) ---------- */

// Se registra ANTES de abrir el cajon: nunca sale dinero sin rastro. Necesita
// red. El id se genera al abrir el dialogo: reintentar no duplica la salida.
// Gastos hasta $100 sin aprobacion (Isaac, 28/09); uno mayor lo registra el dueno.

}

/* ---------- corte de caja (Issue #100) ---------- */

let idCorte = null;
let ultimoCorte = null;

$('abrir-corte').addEventListener('click', async () => {
  if (!exigirCaja()) return;
  idCorte = crypto.randomUUID();
  $('corte-caja').textContent = cajaActual();

  $('corte-paso-resultado').hidden = true;

  $('corte-registrar').disabled = true;

    $('corte-aviso').textContent = `Hay ${pendientes} ventas sin sincronizar. Espera a tener red antes del corte.`;
  } else if (rechazadas) {
    $('corte-aviso').textContent = `Hay ${rechazadas} ventas rechazadas: reintenta o descarta cada una antes del corte.`;
  } else {
    $('corte-registrar').disabled = false;
  }
  $('corte-efectivo').focus();
});

$('corte-salir').addEventListener('click', () => { $('dialogo-corte').close(); $('codigo').focus(); });
$('corte-cerrar').addEventListener('click', () => { $('dialogo-corte').close(); $('codigo').focus(); });

function pintarResultado(c) {
  const renglon = (etiqueta, valor, clase = '') => `<tr class="${clase}"><td>${etiqueta}</td><td>${valor}</td></tr>`;
  const diferencia = c.diferencia === 0
    ? renglon('Diferencia', pesos(0))
    : renglon(c.diferencia > 0 ? 'Sobrante' : 'Faltante', pesos(Math.abs(c.diferencia)), c.diferencia > 0 ? 'sobra' : 'falta');
  const tarjeta = c.tarjeta_terminal - c.tarjeta_sistema;
  $('corte-resumen').innerHTML = `<table>
    ${renglon('Ventas cobradas', c.tickets)}
    ${renglon('Fondo inicial', pesos(c.fondo_inicial))}
    ${renglon('+ Ventas en efectivo', pesos(c.efectivo_ventas))}
    ${renglon('− Devoluciones', pesos(c.efectivo_devoluciones))}
    ${renglon('− Retiros', pesos(c.retiros))}
    ${renglon('− Gastos', pesos(c.gastos))}
    ${renglon('= Esperado', pesos(c.efectivo_esperado), 'fuerte')}
    ${renglon('Contado', pesos(c.efectivo_contado), 'fuerte')}
    ${diferencia}
    ${renglon('Tarjeta: sistema / terminal', `${pesos(c.tarjeta_sistema)} / ${pesos(c.tarjeta_terminal)}`, tarjeta ? 'falta' : '')}
    ${renglon('Transferencias', pesos(c.transferencias))}
    ${renglon('Dolarones usados', dolares(c.dolarones))}
    ${renglon('Se entrega', pesos(c.entregado), 'fuerte')}
    ${renglon('Se queda en la caja (fondo)', pesos(c.fondo_siguiente))}
  </table>`;
}

$('corte-registrar').addEventListener('click', async () => {
  if ($('corte-efectivo').value === '') { $('corte-aviso').textContent = 'Escribe cuánto efectivo hay en el cajón.'; return; }
  const contado = Math.round(Number($('corte-efectivo').value) * 100);
  if (!(contado >= 0)) { $('corte-aviso').textContent = 'Revisa el efectivo del cajón.'; return; }
  const terminal = Math.round(Number($('corte-terminal').value || 0) * 100);
  if (!(terminal >= 0)) { $('corte-aviso').textContent = 'Revisa el total de la terminal.'; return; }
  $('corte-registrar').disabled = true;
  try {
    const r = await fetch('/api/cortes', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: idCorte, caja: cajaActual(), efectivo_contado: contado, tarjeta_terminal: terminal, notas: $('corte-notas').value }),
    });
    const corte = await r.json();
    if (!r.ok) { $('corte-aviso').textContent = corte.error ?? 'No se pudo registrar el corte.'; $('corte-registrar').disabled = false; return; }
    ultimoCorte = corte;
    pintarResultado(corte);
    $('corte-paso-conteo').hidden = true;
    $('corte-paso-resultado').hidden = false;
    const impreso = await imprimirCorte(corte);
    pintarImpresora();
    $('corte-aviso-resultado').textContent = impreso ? '' : 'No se imprimió: revisa la impresora y usa «Imprimir otra vez».';
    actualizarCorte();
  } catch {
    // El id se conserva: reintentar manda el mismo corte, no uno nuevo.
    $('corte-aviso').textContent = 'Sin red: intenta otra vez.';
    $('corte-registrar').disabled = false;
  }
});

$('corte-imprimir').addEventListener('click', async () => {
  if (!ultimoCorte) return;
  const impreso = await imprimirCorte(ultimoCorte);
  pintarImpresora();
  $('corte-aviso-resultado').textContent = impreso ? '' : 'No se imprimió: revisa la impresora.';
});

$('corte-reimprimir').addEventListener('click', async () => {
  try {
    const r = await fetch(`/api/cortes?caja=${encodeURIComponent(cajaActual())}`);
    const corte = await r.json();
    if (!r.ok) { $('corte-aviso').textContent = corte.error ?? 'No se encontró el corte.'; return; }
    const impreso = await imprimirCorte(corte);
    pintarImpresora();
    $('corte-aviso').textContent = impreso
      ? `Reimpreso el corte de ${new Date(corte.hasta).toLocaleString('es-MX')}.`
      : 'No se imprimió: revisa la impresora.';
  } catch {
    $('corte-aviso').textContent = 'Sin red: no se pudo traer el último corte.';
  }
});

$('cancelar').addEventListener('click', () => {
  lineas = []; idVenta = null; quitarSocio(); $('efectivo').value = ''; $('aviso').textContent = 'Venta cancelada';
  $('aviso').style.color = '#5b6478'; pintar(); $('codigo').focus();
});

function pintarRed() {
  $('estado-red').textContent = navigator.onLine ? 'en línea' : 'sin red · cobrando local';
  $('estado-red').className = navigator.onLine ? '' : 'sin-red';
}
addEventListener('online', () => { pintarRed(); sincronizar(); cargarCatalogo(); });
addEventListener('offline', pintarRed);
setInterval(sincronizar, 30000);

function pintarImpresora() {
  const lista = impresoraLista();
  const error = errorImpresora();
  // El error se queda a la vista hasta el siguiente ticket bueno: sin esto la
  // caja decia «conectada» mientras los tickets salian cortados (Issue #97).
  $('impresora-estado').textContent = error && error !== 'no conectada'
    ? `Impresora: ${error}`
    : (lista ? 'Impresora conectada' : 'Impresora no conectada');
  $('impresora-estado').style.color = error && error !== 'no conectada' ? '#D72B32' : '';
  $('conectar-impresora').hidden = lista;
}
$('conectar-impresora').addEventListener('click', async () => {
  let motivo = '';
  try {
    await conectarImpresora();   // WebUSB solo permite pedir el permiso desde un clic real
  } catch (error) {
    console.error('Impresora: no se pudo conectar', error);
    // NotFoundError = cerro el selector sin escoger nada, no es una falla.
    if (error?.name !== 'NotFoundError') motivo = explicarErrorUsb(error);
  }
  pintarImpresora();
  if (motivo) $('impresora-estado').textContent = motivo;   // despues de pintar: pintar lo pisaba
});

pintarRed();
await cargarCatalogo();
pintar();
await pintarRechazadas();
await sincronizar();
await reconectarImpresora();
pintarImpresora();
$('codigo').focus();
</script>
</body>
</html>
