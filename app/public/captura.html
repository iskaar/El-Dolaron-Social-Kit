<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>El Dolarón — captura</title>
<style>
  :root { --azul:#16366B; --rojo:#D72B32; --amarillo:#FFD447; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: #fff;
    font-family: system-ui, -apple-system, sans-serif; overscroll-behavior: none;
    /* Sin esto, tocar rapido +/- se lee como doble-tap y el navegador hace zoom. */
    touch-action: manipulation; }
  #camara { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .encima { position: fixed; left: 0; right: 0; z-index: 2; }
  #contador { top: 0; padding: 10px 14px calc(10px + env(safe-area-inset-top));
    background: linear-gradient(#000c, #0000); font-size: 15px; font-variant-numeric: tabular-nums; }
  #miniaturas { bottom: 132px; display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; }
  #miniaturas img { height: 56px; width: 56px; object-fit: cover; border-radius: 8px;
    border: 3px solid transparent; flex: 0 0 auto; }
  #miniaturas img.danado { border-color: var(--rojo); }
  #miniaturas img.subida { opacity: .55; }
  #barra { bottom: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(#0000, #000c); }
  #estado { flex: 0 0 auto; border: 2px solid #fff; background: #fff; color: #111;
    border-radius: 999px; padding: 12px 18px; font-size: 16px; font-weight: 700; }
  #estado.danado { background: var(--rojo); border-color: var(--rojo); color: #fff; }
  .control-cantidad { display: flex; align-items: center; gap: 0; flex: 0 0 auto;
    border: 2px solid #fff; border-radius: 999px; overflow: hidden; background: #0006; }
  .control-cantidad button { width: 42px; height: 46px; border: 0; background: none; color: #fff;
    font-size: 24px; font-weight: 700; }
  .control-cantidad button:active { background: #fff3; }
  /* Un <input> sin "width" toma su ancho nativo (~20 caracteres): sin esto la
     caja se hace enorme y empuja o tapa el boton de disparo. */
  .control-cantidad .valor { width: 34px; text-align: center; font-size: 18px; font-weight: 800;
    font-variant-numeric: tabular-nums; background: none; border: 0; color: #fff; padding: 0; }
  /* Se resalta mientras se edita: siempre es un input real, nunca "readonly"
     (en iOS el teclado no aparece si el campo se vuelve editable recien al tocarlo). */
  .control-cantidad .valor:focus { background: #fff3; border-radius: 6px; outline: none; }
  .control-cantidad.varias { border-color: var(--amarillo); color: var(--amarillo); }
  #disparo { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff;
    background: #fff5; flex: 0 0 auto; }
  #disparo:active { background: #fff; }
  #ayuda { flex: 1; font-size: 13px; opacity: .85; line-height: 1.3; }
  #error { position: fixed; inset: 0; z-index: 5; display: none; padding: 24px;
    background: #111; flex-direction: column; justify-content: center; gap: 16px; }
  #error button { padding: 14px; font-size: 16px; border: 0; border-radius: 10px;
    background: var(--amarillo); color: #111; font-weight: 700; }

  /* Revisar una foto ya tomada: como tocar la miniatura de la esquina en la
     camara del iPhone. Mientras siga en la cola local se puede corregir la
     cantidad, marcarla danada, retomarla o descartarla. Ya subida, solo avisa
     que la correccion es en la cola de revision. */
  #revisar { position: fixed; inset: 0; z-index: 6; display: none; flex-direction: column;
    background: #000; }
  #revisar.abierto { display: flex; }
  #revisar-foto { flex: 1; width: 100%; object-fit: contain; min-height: 0; }
  #revisar-acciones { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); }
  .fila-revisar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #revisar button { border: 2px solid #fff; background: #0006; color: #fff; border-radius: 999px;
    padding: 10px 16px; font-size: 14px; font-weight: 700; }
  #revisar button.peligro { border-color: var(--rojo); color: var(--rojo); }
  #revisar button.principal { background: var(--amarillo); border-color: var(--amarillo); color: #111; flex: 1; }
  #revisar-cerrar { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px;
    width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; }
</style>
</head>
<body>
<video id="camara" playsinline autoplay muted></video>

<div id="contador" class="encima">0 fotos · 0 subidas</div>
<div id="miniaturas" class="encima"></div>

<div id="barra" class="encima">
  <button id="estado" type="button">Nuevo</button>
  <div id="cantidad" class="control-cantidad">
    <button type="button" data-paso="-1" aria-label="Menos piezas">−</button>
    <input class="valor" type="text" inputmode="numeric" pattern="[0-9]*" value="1">
    <button type="button" data-paso="1" aria-label="Más piezas">+</button>
  </div>
  <button id="disparo" type="button" aria-label="Tomar foto"></button>
  <span id="ayuda">Toca una miniatura para revisarla, corregir la cantidad o retomarla.</span>
</div>

<div id="error">
  <h2 id="error-texto"></h2>
  <button id="reintentar" type="button">Reintentar</button>
</div>

<div id="revisar">
  <button id="revisar-cerrar" type="button" aria-label="Cerrar">✕</button>
  <img id="revisar-foto" alt="">
  <div id="revisar-acciones">
    <div class="fila-revisar">
      <button id="revisar-estado" type="button"></button>
      <div id="revisar-cantidad" class="control-cantidad"></div>
    </div>
    <div class="fila-revisar">
      <button id="revisar-descartar" type="button" class="peligro">Descartar</button>
      <button id="revisar-retomar" type="button" class="principal">Retomar foto</button>
    </div>
  </div>
</div>

<script type="module">
import { aJpeg } from '/foto.js';

const video = document.getElementById('camara');
const contador = document.getElementById('contador');
const miniaturas = document.getElementById('miniaturas');
const botonEstado = document.getElementById('estado');
const panelError = document.getElementById('error');
const textoError = document.getElementById('error-texto');

let estadoFisico = 'nuevo';
let cantidad = 1;   // piezas identicas que representa la foto
let tomadas = 0;
let piezasTotales = 0;
let subidas = 0;
let subiendo = false;

/* ---------- cola local: la foto se guarda antes de intentar subirla ---------- */

function abrirBase() {
  return new Promise((resolve, reject) => {
    const solicitud = indexedDB.open('eldolaron', 1);
    solicitud.onupgradeneeded = () => solicitud.result.createObjectStore('pendientes', { keyPath: 'id' });
    solicitud.onsuccess = () => resolve(solicitud.result);
    solicitud.onerror = () => reject(solicitud.error);
  });
}

async function conStore(modo, fn) {
  const base = await abrirBase();
  return new Promise((resolve, reject) => {
    const transaccion = base.transaction('pendientes', modo);
    const solicitud = fn(transaccion.objectStore('pendientes'));
    solicitud.onsuccess = () => resolve(solicitud.result);
    solicitud.onerror = () => reject(solicitud.error);
  });
}

const guardar = (registro) => conStore('readwrite', (s) => s.put(registro));
const borrar = (id) => conStore('readwrite', (s) => s.delete(id));
const pendientes = () => conStore('readonly', (s) => s.getAll());

/* ---------- camara ---------- */

async function encenderCamara() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } },
      audio: false,
    });
    video.srcObject = stream;
    panelError.style.display = 'none';
  } catch {
    textoError.textContent = 'No se pudo abrir la cámara. Revisa los permisos del navegador.';
    panelError.style.display = 'flex';
  }
}

/** Reduce la foto antes de guardarla: alcanza para la IA, la etiqueta y el catálogo. */
const capturar = () => aJpeg(video, video.videoWidth, video.videoHeight);

function pintarMiniatura(registro) {
  const img = document.createElement('img');
  img.src = URL.createObjectURL(registro.foto);
  img.dataset.id = registro.id;
  img.className = registro.estado_fisico === 'danado' ? 'danado' : '';
  img.addEventListener('click', () => abrirRevision(registro.id, img));
  miniaturas.prepend(img);
  while (miniaturas.children.length > 20) miniaturas.lastChild.remove();
}

/* ---------- revisar una foto ya tomada: como la miniatura del iPhone ---------- */

const elRevisar = document.getElementById('revisar');
const elRevisarFoto = document.getElementById('revisar-foto');
const elRevisarEstado = document.getElementById('revisar-estado');
const elRevisarCantidad = document.getElementById('revisar-cantidad');
const elDescartar = document.getElementById('revisar-descartar');
let registroActual = null;

function pintarEstadoRevision() {
  const danado = registroActual.estado_fisico === 'danado';
  elRevisarEstado.textContent = danado ? 'Dañado' : 'Nuevo';
  elRevisarEstado.classList.toggle('danado', danado);
}

/** Solo mientras la foto sigue en la cola local: ya subida, se corrige desde la cola de revision. */
async function abrirRevision(id, img) {
  const cola = await pendientes();
  const registro = cola.find((r) => r.id === id);
  if (!registro) {
    img.classList.add('subida');
    return;
  }
  registroActual = registro;
  elRevisarFoto.src = img.src;
  elDescartar.textContent = 'Descartar';
  pintarEstadoRevision();
  elRevisarCantidad.innerHTML = `<button type="button" data-paso="-1" aria-label="Menos piezas">−</button>
    <input class="valor" type="text" inputmode="numeric" pattern="[0-9]*">
    <button type="button" data-paso="1" aria-label="Más piezas">+</button>`;
  activarControlCantidad(elRevisarCantidad, () => registroActual.cantidad, (valor) => {
    piezasTotales += valor - registroActual.cantidad;
    registroActual.cantidad = valor;
    guardar(registroActual);
    actualizarContador();
  });
  elRevisar.classList.add('abierto');
}

function cerrarRevision() {
  elRevisar.classList.remove('abierto');
  registroActual = null;
}

elRevisarEstado.addEventListener('click', async () => {
  registroActual.estado_fisico = registroActual.estado_fisico === 'danado' ? 'nuevo' : 'danado';
  await guardar(registroActual);
  pintarEstadoRevision();
  const img = miniaturas.querySelector(`img[data-id="${registroActual.id}"]`);
  if (img) img.classList.toggle('danado', registroActual.estado_fisico === 'danado');
});

document.getElementById('revisar-retomar').addEventListener('click', async () => {
  const foto = await capturar();
  if (!foto) return;
  registroActual.foto = foto;
  await guardar(registroActual);
  const anterior = elRevisarFoto.src;
  elRevisarFoto.src = URL.createObjectURL(foto);
  URL.revokeObjectURL(anterior);
  const img = miniaturas.querySelector(`img[data-id="${registroActual.id}"]`);
  if (img) img.src = elRevisarFoto.src;
  cerrarRevision();
});

// Un dialogo nativo (confirm()) congela toda la pestana mientras esta abierto,
// mala idea sobre una camara de pantalla completa. Un segundo toque en el mismo
// boton confirma en su lugar; alejarse de "revisar" lo resetea.
elDescartar.addEventListener('click', async () => {
  if (elDescartar.textContent !== '¿Seguro?') {
    elDescartar.textContent = '¿Seguro?';
    return;
  }
  tomadas -= 1;
  piezasTotales -= registroActual.cantidad;
  await borrar(registroActual.id);
  miniaturas.querySelector(`img[data-id="${registroActual.id}"]`)?.remove();
  actualizarContador();
  cerrarRevision();
});

document.getElementById('revisar-cerrar').addEventListener('click', cerrarRevision);

async function disparar() {
  const foto = await capturar();
  if (!foto) return;
  const registro = { id: crypto.randomUUID(), foto, estado_fisico: estadoFisico, cantidad, creado: Date.now() };
  await guardar(registro);           // primero al disco, siempre
  tomadas += 1;
  piezasTotales += cantidad;
  pintarMiniatura(registro);
  actualizarContador();
  procesarCola();                    // sin await: la camara no espera a la red
}

/* ---------- subida: de una en una, con reintento ---------- */

async function procesarCola() {
  if (subiendo) return;
  subiendo = true;
  try {
    for (const registro of await pendientes()) {
      const cuerpo = new FormData();
      cuerpo.append('id', registro.id);
      cuerpo.append('estado_fisico', registro.estado_fisico);
      cuerpo.append('cantidad', String(registro.cantidad ?? 1));
      cuerpo.append('foto', registro.foto, `${registro.id}.jpg`);

      let respuesta;
      try {
        respuesta = await fetch('/api/borradores', { method: 'POST', body: cuerpo });
      } catch {
        break;                       // sin red: la foto se queda en la cola
      }
      if (respuesta.status >= 500) break;
      await borrar(registro.id);     // 2xx, o 4xx que no mejora reintentando
      if (respuesta.ok) {
        subidas += 1;
        const img = miniaturas.querySelector(`img[data-id="${registro.id}"]`);
        if (img) img.classList.add('subida');
      }
      actualizarContador();
    }
  } finally {
    subiendo = false;
  }
}

function actualizarContador() {
  const piezas = tomadas === 0 ? '' : ` · ${piezasTotales} piezas`;
  contador.textContent = `${tomadas} fotos${piezas} · ${subidas} subidas`;
}

/**
 * Un +/- con el numero editable a mano: tocar el numero lo cambia por un input
 * en su lugar, en vez de darle +1 hasta veinte veces para llegar a un lote grande.
 * Mismo patron para la barra de disparo y para la cantidad en "revisar".
 */
function activarControlCantidad(contenedor, obtener, fijar) {
  const entrada = contenedor.querySelector('.valor');
  const pintar = () => {
    entrada.value = obtener();
    contenedor.classList.toggle('varias', obtener() > 1);
  };
  contenedor.querySelectorAll('button[data-paso]').forEach((boton) => {
    boton.addEventListener('click', () => {
      fijar(Math.min(99, Math.max(1, obtener() + Number(boton.dataset.paso))));
      pintar();
    });
  });
  // Nada de "readonly" que se quita al tocar: en iOS el teclado solo aparece
  // si el campo YA era editable en el momento del toque, no un instante despues.
  entrada.addEventListener('focus', () => entrada.select());
  const confirmarEdicion = () => {
    fijar(Math.min(99, Math.max(1, Math.round(Number(entrada.value)) || 1)));
    pintar();
  };
  entrada.addEventListener('blur', confirmarEdicion);
  entrada.addEventListener('keydown', (evento) => { if (evento.key === 'Enter') entrada.blur(); });
  pintar();
}

activarControlCantidad(document.getElementById('cantidad'), () => cantidad, (valor) => { cantidad = valor; });

/* ---------- arranque ---------- */

botonEstado.addEventListener('click', () => {
  estadoFisico = estadoFisico === 'nuevo' ? 'danado' : 'nuevo';
  botonEstado.textContent = estadoFisico === 'nuevo' ? 'Nuevo' : 'Dañado';
  botonEstado.classList.toggle('danado', estadoFisico === 'danado');
});
document.getElementById('disparo').addEventListener('click', disparar);
document.getElementById('reintentar').addEventListener('click', encenderCamara);
addEventListener('online', procesarCola);
setInterval(procesarCola, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) encenderCamara(); });

encenderCamara();
procesarCola();
</script>
</body>
</html>
