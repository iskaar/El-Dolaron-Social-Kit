<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Dolarón — guía de la caja</title>
<style>
  :root { --azul:#16366B; --rojo:#D72B32; --amarillo:#FFD447; --linea:#dfe3ea; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f6f9; color: #1a1f2b; font-family: system-ui, -apple-system, sans-serif; }
  header { background: var(--azul); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  header a { color: var(--amarillo); font-size: 16px; }
  header a:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>¿Cómo se hace?</h1>
  <a href="/caja">Volver a la caja</a>
</header>
<main id="guia"><p>Cargando la guía…</p></main>
<script type="module">
const guia = document.getElementById('guia');
try {
  const { montarAyuda } = await import('/ayuda.js');
  montarAyuda(guia, { ancla: location.hash.slice(1), conHash: true });
} catch {
  guia.textContent = 'No se pudo cargar la guía. Revisa la conexión y recarga la página.';
}
</script>
</body>
</html>
