<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>El Dolarón · Inventario</title><link rel="stylesheet" href="/inventario.css"></head><body>
<svg hidden aria-hidden="true"><symbol id="i-camara" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v14H3z M16 14a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></symbol><symbol id="i-codigo" viewBox="0 0 24 24"><path d="M3 4v16M7 4v16M10 4v16M15 4v16M18 4v16M21 4v16"/></symbol><symbol id="i-impresora" viewBox="0 0 24 24"><path d="M6 8V3h12v5M6 17H3V8h18v9h-3M6 14h12v7H6z"/></symbol><symbol id="i-celular" viewBox="0 0 24 24"><path d="M6 2h12v20H6zM10 18h4"/></symbol><symbol id="i-red" viewBox="0 0 24 24"><path d="M3 20h3v-4H3zM10 20h3V10h-3zM17 20h3V4h-3z"/></symbol><symbol id="i-red-off" viewBox="0 0 24 24"><path d="M3 3l18 18M3 20h3v-4H3M10 20h3v-7M17 12V4h3v11"/></symbol><symbol id="i-buscar" viewBox="0 0 24 24"><path d="M16 16l6 6M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0"/></symbol><symbol id="i-revisar" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM6 12l4 4 8-9"/></symbol><symbol id="i-etiqueta" viewBox="0 0 24 24"><path d="M3 3h8l10 10-8 8L3 11zM7 7h1"/></symbol><symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></symbol><symbol id="i-menos" viewBox="0 0 24 24"><path d="M3 12h18"/></symbol><symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M3 12l6 6L21 4"/></symbol><symbol id="i-aviso" viewBox="0 0 24 24"><path d="M12 2L2 21h20zM12 8v6M12 17v1"/></symbol><symbol id="i-error" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM12 7v6M12 16v1"/></symbol><symbol id="i-teclado" viewBox="0 0 24 24"><path d="M2 5h20v14H2zM6 9h1M11 9h1M16 9h1M6 14h12"/></symbol><symbol id="i-nube-off" viewBox="0 0 24 24"><path d="M3 3l18 18M5 16a4 4 0 0 1 0-8 7 7 0 0 1 13-1 5 5 0 0 1 3 9M6 18h9"/></symbol><symbol id="i-foto" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 16l6-6 12 11M16 7h1"/></symbol><symbol id="i-engrane" viewBox="0 0 24 24"><path d="M9 3h6v4l4 2 3 3-3 3-4 2v4H9v-4l-4-2-3-3 3-3 4-2zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/></symbol></svg>
<a class="saltar" href="#consulta">Ir a la caja</a>
<header><div class="marca"><b>EL</b><h1>Inventario</h1></div><nav id="modos" role="tablist" aria-label="Modos de inventario"><button id="tab-capturar" role="tab" aria-controls="modo-capturar" aria-selected="false" tabindex="-1" data-modo="capturar"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-camara"/></svg>Capturar<kbd>Alt+1</kbd></button><button id="tab-buscar" role="tab" aria-controls="modo-buscar" aria-selected="false" tabindex="-1" data-modo="buscar"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-buscar"/></svg>Buscar<kbd>Alt+2</kbd></button><button id="tab-revisar" role="tab" aria-controls="modo-revisar" aria-selected="false" tabindex="-1" data-modo="revisar"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-revisar"/></svg>Revisar<kbd>Alt+3</kbd></button><button id="tab-imprimir" role="tab" aria-controls="modo-imprimir" aria-selected="false" tabindex="-1" data-modo="imprimir"><svg class="icono" aria-hidden="true" focusable="false"><use href="#i-etiqueta"/></svg>Imprimir<kbd>Alt+4</kbd></button></nav><button id="chip-impresora" class="chip-conexion aviso" type="button" aria-label="Impresora sin conectar">▲ Sin conectar</button><button id="chip-celular" class="chip-conexion pc" type="button">Celular · Apagado</button><button id="chip-red" class="chip-conexion" type="button">● Red</button><button id="menu" class="chip-conexion" type="button" aria-label="Menú">⋯</button></header>
<div id="estado" class="linea-estado" role="status" aria-live="polite" aria-atomic="true">● Escanea o escribe</div><div id="error" class="linea-estado" role="alert" hidden></div>
<main id="contenido"><form id="busqueda" class="caja"><label for="consulta">Código o nombre <span id="lector-listo">● Lector listo</span></label><div class="acciones"><input id="consulta" type="search" maxlength="80" autocomplete="off" enterkeyhint="search" inputmode="none" placeholder="UPC, ED- o nombre"><button id="enviar-consulta" type="submit" aria-label="Buscar">Buscar</button><button id="camara-etiqueta" type="button" aria-label="Leer etiqueta con cámara">Cámara</button></div></form>
<section id="modo-capturar" data-activo="true" role="tabpanel" aria-labelledby="tab-capturar" hidden><h2>Capturar</h2><a href="/captura">Abrir captura</a></section>
<section id="modo-buscar" role="tabpanel" aria-labelledby="tab-buscar" hidden><div class="columnas"><section id="buscador" aria-label="Resultados"><div id="visor" hidden></div><p id="resumen" class="ayuda">Todo el inventario · más recientes primero</p><ul id="resultados" class="lista" aria-label="Piezas encontradas"></ul><button id="mas" type="button" hidden>Cargar más</button></section><div id="detalle-buscar">  <section id="ficha" aria-label="Ficha de pieza" hidden>
    <div class="acciones"><button id="volver" class="secundario" type="button">← Resultados</button><b id="codigo"></b></div>
    <div class="presentacion">
      <div><img id="foto" alt="" hidden><div id="sin-foto">Sin foto</div></div>
      <div class="datos"><h2 id="nombre"></h2><p id="detalles" class="ayuda"></p><p id="upc" class="ayuda"></p><p><strong id="precio"></strong><span id="precio-lista"></span></p>
        <h3>Existencia</h3><button id="solo-consulta" class="solo-consulta" type="button" hidden>Solo consulta</button>
        <div class="acciones"><button id="menos" type="button" aria-label="Bajar existencia en uno" hidden>−</button><output id="stock" aria-label="Existencia actual"></output><button id="sumar" type="button" aria-label="Subir existencia en uno" hidden>+</button></div>
        <div id="existencia" hidden>
          <label for="motivo">Motivo</label>
          <select id="motivo">
            <option value="correccion">Corrección</option>
            <optgroup label="Al bajar"><option value="robo">Robo</option><option value="merma">Merma</option><option value="error de captura">Error de captura</option></optgroup>
            <optgroup label="Al subir"><option value="entrada">Entrada</option></optgroup>
          </select>
          <form id="fijar" hidden><label for="fijar-a">Fijar a…</label><div class="acciones"><input id="fijar-a" type="number" min="0" max="999" step="1" required><button id="ajustar" type="submit">Fijar a…</button></div></form>
          <button id="deshacer" class="secundario" type="button" hidden>Deshacer</button>
        </div>
      </div>
    </div>
    <div id="edicion" hidden>
      <h3>Corregir datos</h3>
      <p id="nota-edicion" class="ayuda"></p>
      <button id="editar" class="secundario" type="button" aria-controls="corregir">Editar</button>
      <form id="corregir" hidden>
        <label for="e-nombre">Nombre</label><input id="e-nombre" maxlength="120" required>
        <label for="e-marca">Marca</label><input id="e-marca" maxlength="60">
        <label for="e-talla">Talla</label><input id="e-talla" list="tallas" maxlength="30"><datalist id="tallas"></datalist>
        <div id="campos-precio" hidden>
          <label for="e-precio">Precio de venta ($)</label><input id="e-precio" inputmode="decimal" autocomplete="off">
          <label for="e-lista">Precio de lista ($)</label><input id="e-lista" inputmode="decimal" autocomplete="off">
        </div>
        <p id="nota-precio" class="ayuda"></p>
        <div class="acciones"><button id="guardar-correccion" type="submit">Guardar cambios</button><button id="cancelar-correccion" class="secundario" type="button">Cancelar</button></div>
      </form>
      <div id="reimprimir" hidden><p id="reimprimir-texto"></p><a id="reimprimir-enlace" href="/etiquetas">Reimprimir etiqueta</a></div>
    </div>
    <div id="acciones-ficha" class="acciones"></div><details><summary>Historial de existencia</summary><ol id="historial"></ol></details>
  </section>
</div></div></section>
<section id="modo-revisar" data-activo="true" role="tabpanel" aria-labelledby="tab-revisar" hidden><h2>Revisar</h2><a href="/admin">Abrir revisión</a></section>
<section id="modo-imprimir" data-activo="true" role="tabpanel" aria-labelledby="tab-imprimir" hidden><h2>Imprimir</h2><a href="/etiquetas">Abrir etiquetas</a></section>
<button id="reintentar" type="button" hidden>Reintentar ajuste pendiente</button></main>
<dialog id="hoja" aria-labelledby="hoja-titulo"><button id="cerrar-hoja" class="cerrar" type="button" aria-label="Cerrar">✕</button><h2 id="hoja-titulo"></h2><div id="hoja-cuerpo"></div></dialog>
<script type="module" src="/inventario.js"></script></body></html>
