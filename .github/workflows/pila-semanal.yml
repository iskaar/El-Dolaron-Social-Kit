name: Pila semanal de la portada

# Issue #531. Regenera la pila de stickers de la portada (site/public/assets/pila*)
# cada lunes y la publica sola. Autorizado por Isaac el 25/10/2026; no ampliar sin
# nueva autorización.
on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # solo para lanzar deploy-sitio.yml al final

concurrency:
  group: pila-semanal
  cancel-in-progress: false

jobs:
  pila:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Generar la pila
        run: python tools/pila_stickers.py
      - name: Detectar cambios
        id: cambios
        run: |
          if [ -z "$(git status --porcelain site/public/assets)" ]; then
            echo "::notice::La pila no cambió; no hay nada que publicar."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi
      # Los PR abiertos con GITHUB_TOKEN no disparan el CI normal (validate.yml), así
      # que las validaciones corren aquí y, si pasan, el mismo job mezcla el PR.
      - name: Validar
        if: steps.cambios.outputs.hay == 'true'
        run: |
          python tools/validate_assets.py
          python tools/validate_site.py
      - name: PR y merge
        if: steps.cambios.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semana=$(date -u +%G-W%V)
          rama="bot/pila-$semana"
          piezas=$(python -c "import json; d=json.load(open('site/public/assets/pila.json')); d=d.get('piezas', d) if isinstance(d, dict) else d; print(len(d))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add site/public/assets
          git commit -m "Portada: pila de stickers de la semana $semana (#531)"
          git push origin "$rama"
          printf 'Semana: %s\nPiezas en la pila: %s\n\nGenerada por pila-semanal.yml. Issue #531.\n' "$semana" "$piezas" > "$RUNNER_TEMP/cuerpo.md"
          gh pr create --base main --head "$rama" \
            --title "Portada: pila de stickers de la semana $semana (#531)" \
            --body-file "$RUNNER_TEMP/cuerpo.md"
          gh pr merge "$rama" --merge --delete-branch
      # Un merge hecho con GITHUB_TOKEN no dispara el push a main de deploy-sitio.yml;
      # workflow_dispatch sí está permitido.
      - name: Publicar el sitio
        if: steps.cambios.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-sitio.yml --ref main
