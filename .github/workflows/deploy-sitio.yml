name: Deploy del sitio

# Issue #531. Publica eldolaron.com (Worker el-dolaron-web) en cada push a main que
# toque site/, cada lunes 06:00 UTC (la rotación semanal de la pila de la portada) y a
# mano. Autorizado por Isaac el 25/10/2026 con el secreto CLOUDFLARE_API_TOKEN; el repo
# nunca guarda el token. No ampliar sin nueva autorización.
#
# La pila de site/public/assets/pila* que está en el repo es solo la base y el respaldo:
# el sitio en vivo siempre lleva la pila de la semana ISO actual. El script es
# determinista por semana, así que un deploy manual a mitad de semana reproduce la pila
# del lunes. Los archivos generados solo existen en el runner; no se commitea nada, así
# que la protección de main nunca interviene.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sitio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow==13.0.0
      - name: Generar la pila de la semana
        id: pila
        continue-on-error: true
        run: python tools/pila_stickers.py
      - name: Aviso si la pila no se generó
        if: steps.pila.outcome == 'failure'
        run: echo "::warning::No se pudo generar la pila de la semana (¿catálogo inaccesible?). Se publica la pila del repo como respaldo."
      - name: Validate inventory and assets
        run: python tools/validate_assets.py
      - name: Validate public storefront
        run: python tools/validate_site.py
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # El Wrangler fijado en app/package-lock.json exige Node >= 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verificar el secreto
        env:
          # Solo si existe; el valor entra unicamente al paso de deploy.
          HAY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAY_TOKEN" != "true" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions). Ver site/README.md."
            exit 1
          fi
      - name: Install Wrangler (versión del lockfile de app/)
        run: npm ci --prefix app
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: app/node_modules/.bin/wrangler deploy --config site/wrangler.jsonc
