name: Deploy del sitio

# Issue #531. Publica eldolaron.com (Worker el-dolaron-web) en cada push a main que
# toque site/. Autorizado por Isaac el 25/10/2026 con el secreto CLOUDFLARE_API_TOKEN;
# el repo nunca guarda el token. No ampliar a la app de caja sin nueva autorización.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sitio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # El Wrangler fijado en app/package-lock.json exige Node >= 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verificar el secreto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions). Ver site/README.md."
            exit 1
          fi
      - name: Install Wrangler (versión del lockfile de app/)
        run: npm ci --prefix app
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: app/node_modules/.bin/wrangler deploy --config site/wrangler.jsonc
